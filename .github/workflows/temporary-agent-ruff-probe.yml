name: Temporary Agent Ruff Probe
on:
  push:
    branches:
      - fix/agent-dispatch-fail-closed
jobs:
  import-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.6 black==26.10.1
      - run: ruff check --fix --diff shadow313/v2/agent/agent.py || true
      - run: black --check --diff shadow313/v2/agent/agent.py || true
