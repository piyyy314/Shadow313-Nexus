name: Temporary Ruff Import Fix

on:
  push:
    branches:
      - fix/ci-audit-blockers

permissions:
  contents: write

jobs:
  import-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.5
      - name: Apply Ruff's import ordering to GhostHTTP
        run: ruff check --select I --fix shadow313/tools/redteam/ghosthttp.py
      - name: Commit import-only fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow313/tools/redteam/ghosthttp.py
          if git diff --cached --quiet; then
            echo "No import changes needed."
            exit 0
          fi
          git commit -m "style(ghosthttp): apply Ruff import ordering"
          git push origin "HEAD:${GITHUB_REF_NAME}"
