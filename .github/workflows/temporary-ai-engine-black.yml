name: Temporary AI Engine Black Formatter
on:
  push:
    branches:
      - fix/ai-engine-config-safety
permissions:
  contents: write
jobs:
  format-ai-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/ai-engine-config-safety
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install black==24.3.0
      - run: black shadow313/core/ai_engine/__init__.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow313/core/ai_engine/__init__.py
          if git diff --cached --quiet; then
            echo "AI engine file is already formatted."
          else
            git commit -m "style(ai): apply Black formatting"
            git push origin HEAD:fix/ai-engine-config-safety
          fi
