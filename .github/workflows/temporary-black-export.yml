name: Temporary Black Formatting Export

on:
  push:
    branches:
      - fix/ci-audit-blockers

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the repository Black version
        run: python -m pip install black==26.10.1
      - name: Format the repaired Python files
        run: |
          black \
            shadow313/modules/cicd/pipeline.py \
            shadow313/tools/redteam/ghosthttp.py \
            shadow313/v4/detection/adaptive_defense_loop.py \
            shadow313/v4/detection/advanced_detection_layer.py \
            tests/unit/test_ci_workflow_security.py
      - name: Export formatted source files
        uses: actions/upload-artifact@v7
        with:
          name: black-formatted-sources
          path: |
            shadow313/modules/cicd/pipeline.py
            shadow313/tools/redteam/ghosthttp.py
            shadow313/v4/detection/adaptive_defense_loop.py
            shadow313/v4/detection/advanced_detection_layer.py
            tests/unit/test_ci_workflow_security.py
          if-no-files-found: error
