name: Public Site Build Validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build allowlisted public-site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build allowlisted public site
        run: node scripts/build-public-site.cjs

      - name: Verify publication boundary
        run: node --test tests/public-site-boundary.test.cjs

      - name: Upload public-site artifact for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow313-public-site-${{ github.sha }}
          path: public-site/
          retention-days: 7
