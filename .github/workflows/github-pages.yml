# Shadow313 NEXUS — GitHub Pages Deployment
# Deploys docs/ folder to GitHub Pages at piyyy314.github.io/Shadow313-Nexus

name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "index.html"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          # Copy root index.html
          cp index.html _site/index.html
          # Copy all docs
          cp -r docs/ _site/docs/
          # Create a simple 404 page
          cat > _site/404.html << 'HTML'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8">
          <title>404 — Shadow313 NEXUS</title>
          <meta http-equiv="refresh" content="2;url=/">
          <style>body{background:#020617;color:#e2e8f0;font-family:monospace;text-align:center;padding:80px}</style>
          </head><body>
          <h1 style="color:#22c55e">Shadow313 NEXUS</h1>
          <p>Page not found — redirecting to home...</p>
          </body></html>
          HTML
          # Copy tools/ marketplace/ about/ directories
          cp -r tools/ _site/tools/ 2>/dev/null || true
          cp -r marketplace/ _site/marketplace/ 2>/dev/null || true
          cp -r about/ _site/about/ 2>/dev/null || true
          # Additional route aliases for clean URLs
          mkdir -p _site/coverage _site/analytics/live _site/vsat _site/aegis-nexus _site/chronos _site/apt-simulation
          cp docs/coverage_matrix.html _site/coverage/index.html 2>/dev/null || true
          cp marketplace/analytics.html _site/analytics/index.html 2>/dev/null || true
          cp marketplace/analytics-live.html _site/analytics/live/index.html 2>/dev/null || true
          cp docs/vsat-tactical-suite.html _site/vsat/index.html 2>/dev/null || true
          cp docs/aegis_nexus.html _site/aegis-nexus/index.html 2>/dev/null || true
          cp docs/chronos-sentinel.html _site/chronos/index.html 2>/dev/null || true
          cp docs/s313-apt-simulation.html _site/apt-simulation/index.html 2>/dev/null || true
          echo "Site contents:"
          find _site -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
