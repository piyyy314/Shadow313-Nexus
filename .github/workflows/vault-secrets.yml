# Shadow313 NEXUS — Vault + OIDC Secrets Integration
# Demonstrates hardened secrets strategy:
#   1. GitHub OIDC → no long-lived tokens
#   2. Vault dynamic secrets → auto-rotation
#   3. Fail-fast validation → blocks on weak secrets

name: Vault Secrets Integration

on:
  workflow_call:
    outputs:
      secrets_valid:
        description: "Whether all required secrets passed validation"
        value: ${{ jobs.validate-secrets.outputs.valid }}

permissions:
  id-token: write   # Required for OIDC
  contents: read

jobs:

  # ── Validate secrets before any deployment ────────────────────────
  validate-secrets:
    name: Fail-Fast Secret Validation
    runs-on: ubuntu-24.04
    outputs:
      valid: ${{ steps.validate.outputs.valid }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Shadow313
        run: pip install -e ".[dev]" -q

      # ── Option A: HashiCorp Vault via OIDC ────────────────────────
      - name: Authenticate to Vault via GitHub OIDC
        if: ${{ vars.VAULT_ADDR != '' }}
        uses: hashicorp/vault-action@d1720f055e0635fd932a1d2a48f87a666a57906c # v3.0.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: github-actions-shadow313
          # Retrieve all required secrets dynamically
          secrets: |
            secret/data/shadow313/api api_key | SHADOW313_API_KEY ;
            secret/data/shadow313/webui secret_key | WEBUI_SECRET_KEY ;
            secret/data/shadow313/ledger api_token | LEDGER_API_TOKEN

      # ── Option B: GitHub Secrets fallback (no Vault) ──────────────
      - name: Load secrets from GitHub Secrets (fallback)
        if: ${{ vars.VAULT_ADDR == '' }}
        env:
          SHADOW313_API_KEY: ${{ secrets.SHADOW313_API_KEY }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
        run: echo "Using GitHub Secrets fallback"

      # ── Fail-fast validation ──────────────────────────────────────
      - name: Validate all secrets (fail-fast)
        id: validate
        env:
          SHADOW313_API_KEY: ${{ env.SHADOW313_API_KEY || secrets.SHADOW313_API_KEY }}
          WEBUI_SECRET_KEY: ${{ env.WEBUI_SECRET_KEY || secrets.WEBUI_SECRET_KEY }}
        run: |
          python3 << 'PYEOF'
          import sys, os
          sys.path.insert(0, '.')
          from shadow313.v4.intelligence.secrets_manager import SecretsValidator

          validator = SecretsValidator()
          report = validator.validate_all(fail_fast=False)

          print("=" * 60)
          print("SECRETS VALIDATION REPORT")
          print("=" * 60)
          for result in report.results:
              status = "✅" if result.valid else ("⚠️" if result.present else "❌")
              print(f"  {status} {result.name}: {result.source}")
              for issue in result.issues:
                  print(f"      ⚠️  {issue}")

          print(f"\nOverall: {'PASS' if report.overall_pass else 'FAIL'}")
          print(f"Critical missing: {report.critical_missing}")
          print(f"Default values:   {report.default_values}")
          print(f"Weak secrets:     {report.weak_secrets}")

          # Write output for downstream jobs
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as f:
              f.write(f"valid={'true' if report.overall_pass else 'false'}\n")

          # Fail if required secrets are missing or use defaults
          if report.critical_missing or report.default_values:
              print("\n::error::FAIL-FAST: Required secrets missing or using defaults")
              sys.exit(1)

          print("\n✅ All required secrets validated successfully")
          PYEOF

  # ── OIDC-based PyPI publishing (no API token needed) ─────────────
  publish-pypi-oidc:
    name: Publish to PyPI (OIDC Trusted Publisher)
    runs-on: ubuntu-24.04
    needs: validate-secrets
    if: ${{ needs.validate-secrets.outputs.valid == 'true' && github.event_name == 'release' }}
    environment:
      name: pypi
      url: https://pypi.org/p/shadow313
    permissions:
      id-token: write  # OIDC — no API token needed

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.3.0
        with:
          python-version: "3.12"

      - name: Build distribution
        run: |
          pip install build
          python -m build

      - name: Publish to PyPI via OIDC (no token required)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          # No password/token — uses OIDC Trusted Publisher

  # ── Secret rotation check ─────────────────────────────────────────
  rotation-check:
    name: Check Secret Rotation Schedule
    runs-on: ubuntu-24.04
    needs: validate-secrets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.3.0
        with:
          python-version: "3.12"

      - name: Install Shadow313
        run: pip install -e ".[dev]" -q

      - name: Print rotation schedule
        run: |
          python3 << 'PYEOF'
          import sys
          sys.path.insert(0, '.')
          from shadow313.v4.intelligence.secrets_manager import get_secret_rotation_schedule

          schedule = get_secret_rotation_schedule()
          print("SECRET ROTATION SCHEDULE")
          print("=" * 60)
          print(f"{'Secret':<30} {'Class':<10} {'Rotate Every':<15} {'Auto'}")
          print("-" * 60)
          for s in schedule:
              auto = "✅ Yes" if s["auto_rotate"] else "Manual"
              days = f"{s['rotation_d']:.0f}d" if s['rotation_d'] >= 1 else f"{s['rotation_h']}h"
              print(f"{s['name']:<30} {s['class']:<10} {days:<15} {auto}")
          PYEOF
