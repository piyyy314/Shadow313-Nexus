# Shadow313 NEXUS — Nightly Security Scan
# Runs every night at 02:00 UTC + on-demand

name: Nightly Security Scan

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Full dependency audit ─────────────────────────────────────────
  dependency-audit:
    name: Full Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install and audit all deps
        run: |
          pip install -e ".[dev]"
          pip freeze --exclude-editable > safety-requirements.txt
          pip install pip-audit==2.7.3 bandit==1.7.8 \
            ruff==0.4.4 black==24.3.0 yamllint==1.35.1
          audit_status=0
          pip-audit --desc --format json -o nightly-pip-audit.json || audit_status=$?
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"
          python -m venv .safety-venv
          .safety-venv/bin/python -m pip install \
            safety==3.8.1
          set +e
          .safety-venv/bin/safety check --json \
            --file safety-requirements.txt > nightly-safety.json
          safety_status=$?
          set -e
          echo "safety_status=$safety_status" >> "$GITHUB_OUTPUT"
          bandit -r shadow313/ nexus_toolkit/ \
            -x shadow313/tests,tests \
            --severity-level medium \
            -f json -o nightly-bandit.json || true
          ruff check shadow313/ nexus_toolkit/ --output-format json > nightly-ruff.json || true
          black --check --diff shadow313/ > nightly-black.txt 2>&1 || true
          yamllint -f parsable -c .yamllint.yml .github/workflows docker-compose.yml \
            > nightly-yamllint.txt 2>&1 || true
        id: audit

      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-security-reports
          path: |
            nightly-pip-audit.json
            nightly-safety.json
            nightly-bandit.json
            nightly-ruff.json
            nightly-black.txt
            nightly-yamllint.txt
          retention-days: 30

      - name: Report pip-audit failure
        if: always() && (steps.audit.outputs.audit_status != '0' || steps.audit.outputs.safety_status != '0')
        env:
          AUDIT_STATUS: ${{ steps.audit.outputs.audit_status }}
          SAFETY_STATUS: ${{ steps.audit.outputs.safety_status }}
        run: |
          if [ "$AUDIT_STATUS" != "0" ]; then echo "::error::pip-audit failed with exit code $AUDIT_STATUS"; fi
          if [ "$SAFETY_STATUS" != "0" ]; then echo "::error::Safety failed with exit code $SAFETY_STATUS"; fi
          exit 1

  # ── Docker image scan ─────────────────────────────────────────────
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image for scanning
        run: |
          docker build --pull --target production -t shadow313-scan:nightly .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "shadow313-scan:nightly"
          severity: "CRITICAL,HIGH"
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-container.sarif"
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

  # ── Secret history scan ───────────────────────────────────────────
  secret-history-scan:
    name: Full Git History Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks full history
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  # ── Docker compose security check ─────────────────────────────────
  compose-security:
    name: Docker Compose Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install checkov
        run: pip install checkov==3.2.0

      - name: Run checkov on docker-compose
        run: |
          checkov -f Dockerfile --framework dockerfile --output cli
          checkov -f docker-compose.yml --framework yaml --output cli

      - name: Verify security hardening
        run: |
          python3 << 'PYEOF'
          import sys
          with open('docker-compose.yml') as f:
              content = f.read()

          checks = {
              "no-new-privileges": "no-new-privileges:true" in content,
              "cap_drop_all": "cap_drop" in content and "ALL" in content,
              "no_docker_socket": "/var/run/docker.sock" not in content,
              "no_privileged": "privileged: true" not in content,
              "no_host_network": "network_mode: host" not in content,
              "internal_network": "internal: true" in content,
              "localhost_binding": "127.0.0.1:" in content,
          }

          failed = []
          for check, passed in checks.items():
              status = "✅" if passed else "❌"
              print(f"  {status} {check}")
              if not passed:
                  failed.append(check)

          if failed:
              print(f"\nFailed checks: {failed}")
              sys.exit(1)
          else:
              print("\n✅ All Docker security checks passed")
          PYEOF
