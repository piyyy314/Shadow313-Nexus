# Shadow313 NEXUS — Nightly Security Scan
# Runs every night at 02:00 UTC + on-demand

name: Nightly Security Scan

on:
  schedule:
    - cron: "0 2 * * *"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/security-scan.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "shadow313/**"
      - "nexus_toolkit/**"
      - "scripts/**"
  push:
    branches:
      - 'fix/**'
      - 'claude/**'
    paths:
      - ".github/workflows/security-scan.yml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "requirements*.txt"
      - "shadow313/**"
      - "nexus_toolkit/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Full dependency audit ─────────────────────────────────────────
  dependency-audit:
    name: Full Dependency Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]"

      - name: Audit installed project dependencies
        id: pip_audit_local
        continue-on-error: true
        run: pip-audit --local --skip-editable --desc --format json -o nightly-pip-audit-local.json

      - name: Audit runtime requirements
        id: pip_audit_requirements
        continue-on-error: true
        run: pip-audit --desc --format json -o nightly-pip-audit-requirements.json -r requirements.txt

      - name: Freeze resolved application dependencies for Safety
        run: python -m pip freeze --exclude-editable > requirements-audit-resolved.txt

      - name: Install supplementary scanners
        run: pip install bandit==1.9.4

      - name: Run Safety against resolved application dependencies
        id: safety_scan
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/safety-env"
          "$RUNNER_TEMP/safety-env/bin/python" -m pip install --disable-pip-version-check safety==3.8.1
          "$RUNNER_TEMP/safety-env/bin/safety" check --json --check-unpinned-requirements --save-json nightly-safety.json -r requirements-audit-resolved.txt > /dev/null

      - name: Run Bandit (retain all severities)
        id: bandit_scan
        continue-on-error: true
        run: |
          bandit -r shadow313/ nexus_toolkit/ \
            -x shadow313/tests,tests \
            -f json -o nightly-bandit.json \
            --exit-zero

      - name: Enforce dependency and SAST results
        if: always()
        env:
          PIP_AUDIT_LOCAL_OUTCOME: ${{ steps.pip_audit_local.outcome }}
          PIP_AUDIT_REQUIREMENTS_OUTCOME: ${{ steps.pip_audit_requirements.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety_scan.outcome }}
          BANDIT_OUTCOME: ${{ steps.bandit_scan.outcome }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import sys
          from pathlib import Path

          outcomes = {
              "pip-audit local": os.environ["PIP_AUDIT_LOCAL_OUTCOME"],
              "pip-audit requirements": os.environ["PIP_AUDIT_REQUIREMENTS_OUTCOME"],
              "Safety": os.environ["SAFETY_OUTCOME"],
              "Bandit execution": os.environ["BANDIT_OUTCOME"],
          }
          failed = [name for name, outcome in outcomes.items() if outcome != "success"]
          for name, outcome in outcomes.items():
              print(f"{name}: {outcome}")

          try:
              safety_report = json.loads(
                  Path("nightly-safety.json").read_text(encoding="utf-8")
              )
              safety_meta = safety_report.get("report_meta")
              if not isinstance(safety_meta, dict):
                  raise ValueError("Safety JSON report has no report_meta object")
              safety_vulnerabilities = safety_meta.get("vulnerabilities_found")
              if not isinstance(safety_vulnerabilities, int):
                  raise ValueError("Safety JSON report has no vulnerability count")
              print(
                  f"Safety report valid: {safety_vulnerabilities} vulnerabilities found."
              )
          except Exception as exc:
              print(f"Safety report unavailable or invalid: {exc}", file=sys.stderr)
              failed.append("Safety report")

          try:
              report = json.loads(Path("nightly-bandit.json").read_text(encoding="utf-8"))
              findings = report.get("results")
              if not isinstance(findings, list):
                  raise ValueError("Bandit JSON report has no results list")
          except Exception as exc:
              print(f"Bandit report unavailable or invalid: {exc}", file=sys.stderr)
              sys.exit(1)

          high = [item for item in findings if item.get("issue_severity", "").upper() == "HIGH"]
          print(f"Bandit findings retained: {len(findings)} total; {len(high)} high severity.")
          for item in high:
              print(
                  f"HIGH: {item.get('filename')}:{item.get('line_number')} "
                  f"{item.get('test_id')} — {item.get('issue_text')}"
              )

          if failed or high:
              print("At least one dependency or SAST scanner failed or reported high-severity findings.", file=sys.stderr)
              sys.exit(1)
          print("Dependency and high-severity SAST gates passed.")
          PYEOF

      - name: Upload audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-security-reports
          path: |
            nightly-pip-audit-local.json
            nightly-pip-audit-requirements.json
            requirements-audit-resolved.txt
            nightly-safety.json
            nightly-bandit.json
          retention-days: 30
          if-no-files-found: warn

  # ── Docker image scan ─────────────────────────────────────────────
  container-scan:
    name: Container Security Scan (Trivy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image for scanning
        run: |
          docker build --pull --target production -t shadow313-scan:nightly .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "shadow313-scan:nightly"
          severity: "CRITICAL,HIGH"
          version: "v0.76.2"
          format: "sarif"
          limit-severities-for-sarif: true
          output: "trivy-container.sarif"
          exit-code: "0"

      - name: Generate Trivy JSON diagnostic report
        if: always()
        continue-on-error: true
        run: |
          trivy image \
            --scanners vuln \
            --severity CRITICAL,HIGH \
            --format json \
            --output trivy-container.json \
            --exit-code 0 \
            shadow313-scan:nightly

      - name: Enforce actionable Trivy findings
        if: always()
        run: |
          python3 << 'PYEOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("trivy-container.json")
          if not report_path.is_file():
              print("::error::Trivy JSON report is missing; scan result cannot be verified.")
              sys.exit(1)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          actionable = []
          unpatched = []
          for result in report.get("Results", []) or []:
              for finding in result.get("Vulnerabilities", []) or []:
                  severity = str(finding.get("Severity", "")).upper()
                  if severity not in {"CRITICAL", "HIGH"}:
                      continue
                  item = {
                      "id": finding.get("VulnerabilityID", "unknown"),
                      "package": finding.get("PkgName", "unknown"),
                      "installed": finding.get("InstalledVersion", "unknown"),
                      "fixed": finding.get("FixedVersion"),
                      "severity": severity,
                  }
                  if item["fixed"]:
                      actionable.append(item)
                  else:
                      unpatched.append(item)

          print(f"Trivy actionable CRITICAL/HIGH findings: {len(actionable)}")
          print(f"Trivy HIGH/CRITICAL findings without a published fixed version: {len(unpatched)}")
          if unpatched:
              print("::warning::Debian/vendor has not published a fixed package version for these HIGH findings; see retained SARIF/JSON artifacts.")
          if actionable:
              for item in actionable:
                  print(f"::error::{item['severity']} {item['id']} {item['package']} {item['installed']} -> {item['fixed'] or 'no fixed version'}")
              sys.exit(1)
          PYEOF
      - name: Archive Trivy SARIF for diagnosis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: trivy-container-sarif
          path: |
            trivy-container.sarif
            trivy-container.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container

  # ── Secret history scan ───────────────────────────────────────────
  secret-history-scan:
    name: Full Git History Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan full Git history with Gitleaks
        run: gitleaks git --redact --exit-code 1 --log-opts="--all" .

  # ── Dockerfile and Compose security checks ────────────────────────
  compose-security:
    name: Dockerfile and Compose Security Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install checkov
        run: pip install checkov==3.2.0

      - name: Run Checkov on Dockerfile
        run: checkov -f Dockerfile --framework dockerfile --output cli

      - name: Run Checkov on Docker Compose
        run: checkov -f docker-compose.yml --framework yaml --output cli

      - name: Verify Compose hardening assertions
        run: |
          python3 << 'PYEOF'
          import sys
          with open('docker-compose.yml') as f:
              content = f.read()

          checks = {
              "no-new-privileges": "no-new-privileges:true" in content,
              "cap_drop_all": "cap_drop" in content and "ALL" in content,
              "no_docker_socket": "/var/run/docker.sock" not in content,
              "no_privileged": "privileged: true" not in content,
              "no_host_network": "network_mode: host" not in content,
              "internal_network": "internal: true" in content,
              "localhost_binding": "127.0.0.1:" in content,
          }

          failed = []
          for check, passed in checks.items():
              status = "✅" if passed else "❌"
              print(f"  {status} {check}")
              if not passed:
                  failed.append(check)

          if failed:
              print(f"\nFailed checks: {failed}")
              sys.exit(1)
          else:
              print("\n✅ All Docker security checks passed")
          PYEOF
