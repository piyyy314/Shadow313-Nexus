name: Temporary Evidence Black Formatter
on:
  push:
    branches:
      - fix/evidence-provenance-accuracy-20261122
permissions:
  contents: write
jobs:
  format-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evidence-provenance-accuracy-20261122
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install black==24.3.0
      - run: black shadow313/v4/intelligence/evidence_envelope.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow313/v4/intelligence/evidence_envelope.py
          if git diff --cached --quiet; then
            echo "Evidence file is already formatted."
          else
            git commit -m "style(evidence): apply Black formatting"
            git push origin HEAD:fix/evidence-provenance-accuracy-20261122
          fi
