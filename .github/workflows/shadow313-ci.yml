# ═══════════════════════════════════════════════════════════════════════════════
# Shadow313 v1 — GitHub Actions CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
name: Shadow313 CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * 1"   # Weekly Monday 03:00 UTC

env:
  PYTHON_VERSION: "3.11"
  SHADOW313_AI_BACKEND: disabled   # No AI in CI (no Ollama)
  SHADOW313_VERBOSE: "false"

jobs:
  # ── Lint & format ─────────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff black mypy pyyaml rich

      - name: Ruff lint
        run: ruff check shadow313/ --output-format github

      - name: Black format check
        run: black --check --diff shadow313/

      - name: MyPy type check
        run: mypy shadow313/ --ignore-missing-imports || true

  # ── Unit tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:             [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Shadow313 + test deps
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --tb=short \
            --cov=shadow313 \
            --cov-report=xml \
            --cov-report=term-missing \
            -x

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests

  # ── Integration tests ─────────────────────────────────────────────────────
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Shadow313
        run: pip install -e ".[dev]" pyyaml rich

      - name: Smoke test — CLI entrypoint
        run: |
          shadow313 --version
          shadow313 --help

      - name: Smoke test — quantum classify
        run: |
          python -c "
          from shadow313.modules.quantum.quantum import classify_algorithm
          r = classify_algorithm('RSA-2048')
          assert r['vuln'] == 'VULNERABLE', f'Expected VULNERABLE, got {r}'
          r2 = classify_algorithm('AES-256')
          assert r2['vuln'] == 'SAFE', f'Expected SAFE, got {r2}'
          print('Quantum classifier: OK')
          "

  # ── Security self-scan ────────────────────────────────────────────────────
  security-scan:
    name: Self Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Shadow313
        run: pip install -e "." pyyaml rich

      - name: Secret scan on diff (PRs)
        if: github.event_name == 'pull_request'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | \
            python -c "
          from shadow313.modules.cicd.cicd import SecretScanner
          import sys
          diff = sys.stdin.read()
          hits = SecretScanner().scan_diff(diff)
          if hits:
              print(f'SECRETS FOUND: {len(hits)}')
              sys.exit(1)
          print('No secrets found')
          " || true

  # ── Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push on PR)
        uses: docker/build-push-action@v5
        with:
          context:   .
          push:      false
          tags:      shadow313/shadow313:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Login to Docker Hub (release only)
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v5
        with:
          context:   .
          push:      true
          tags: |
            shadow313/shadow313:latest
            shadow313/shadow313:${{ github.event.release.tag_name }}

  # ── PyPI publish ──────────────────────────────────────────────────────────
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test, docker]
    if: github.event_name == 'release'
    environment: pypi-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build distribution
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}