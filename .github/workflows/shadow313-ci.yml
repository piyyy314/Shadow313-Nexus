# ═══════════════════════════════════════════════════════════════════════════════
# Shadow313 NEXUS — GitHub Actions CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
name: Shadow313 CI/CD

on:
  push:
    branches: [main, master, develop, "feature/**"]
    tags: ["v*.*.*"]          # triggers PyPI publish
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * 1"       # Weekly Monday 03:00 UTC

env:
  PYTHON_VERSION: "3.11"
  SHADOW313_AI_BACKEND: disabled
  SHADOW313_VERBOSE: "false"

# ── Lint & Format ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev dependencies
        run: pip install ruff black mypy pyyaml rich
      - name: Ruff lint
        run: ruff check shadow313/ --output-format github || true
      - name: Black format check
        run: black --check --diff shadow313/ || true
      - name: MyPy type check
        run: mypy shadow313/ --ignore-missing-imports || true

# ── Unit Tests ────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Shadow313 + test deps
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx fastapi httpx uvicorn pytest-timeout \
            numpy scipy scapy dnspython python-whois cryptography \
            requests aiohttp sqlalchemy pydantic
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/integration \
            --timeout=120 \
            -x
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
        continue-on-error: true

# ── Security Self-Scan ────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "." pyyaml rich bandit safety
      - name: Bandit SAST scan
        run: |
          bandit -r shadow313/ -f json -o bandit-report.json \
            --skip B101,B603,B607,B608,B311,B324 || true
          echo "Bandit scan complete"
      - name: Safety dependency check
        run: safety check --json > safety-report.json || true
      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

# ── Build Package ─────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

# ── Publish to TestPyPI ───────────────────────────────────────────────────────
  publish-test:
    name: Publish → TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Runs on every push to master/main (not just releases)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: testpypi
    permissions:
      id-token: write   # OIDC trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
        continue-on-error: true   # Don't fail CI if TestPyPI publish fails

# ── Publish to PyPI (releases only) ──────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    runs-on: ubuntu-latest
    needs: build
    # Only runs when you create a GitHub Release or push a v* tag
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed!)
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# ── Docker Build ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push on PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: piyyy314/shadow313-nexus:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Login + push (release only)
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            piyyy314/shadow313-nexus:latest
            piyyy314/shadow313-nexus:${{ github.event.release.tag_name }}