# ═══════════════════════════════════════════════════════════════════════════════
# Shadow313 NEXUS — GitHub Actions CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
name: Shadow313 CI/CD

on:
  push:
    branches: [main, master, develop, "feature/**"]
    tags: ["v*.*.*"]          # triggers PyPI publish
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * 1"       # Weekly Monday 03:00 UTC

env:
  PYTHON_VERSION: "3.11"
  SHADOW313_AI_BACKEND: disabled
  SHADOW313_VERBOSE: "false"

# ── Lint & Format ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev dependencies
        run: pip install ruff black mypy pyyaml rich
      - name: Identify changed Python files
        id: changed-python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          mapfile -t candidates < <(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'shadow313/*.py' 'shadow313/**/*.py')
          changed_files=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then
              changed_files+=("$file")
            fi
          done
          printf '%s\n' "${changed_files[@]}" > "$RUNNER_TEMP/shadow313-changed-python.txt"
          echo "count=${#changed_files[@]}" >> "$GITHUB_OUTPUT"
      - name: Ruff lint (changed Python files)
        if: steps.changed-python.outputs.count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/shadow313-changed-python.txt"; ruff check "${files[@]}" --output-format github
      - name: Black format check (changed Python files)
        if: steps.changed-python.outputs.count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/shadow313-changed-python.txt"; black --check --diff "${files[@]}"
      - name: MyPy type check (changed Python files)
        if: steps.changed-python.outputs.count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/shadow313-changed-python.txt"; mypy "${files[@]}" --ignore-missing-imports

# ── Unit Tests ────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Shadow313 + test deps
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx fastapi httpx uvicorn pytest-timeout \
            numpy scipy scapy dnspython python-whois cryptography \
            requests aiohttp sqlalchemy pydantic
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/integration \
            --timeout=120 \
            -x
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
        continue-on-error: true

# ── Security Self-Scan ────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: pip install -e "." pyyaml rich bandit pip-audit
      - name: Bandit SAST scan (retain all severities)
        run: |
          bandit -r shadow313/ -f json -o bandit-report.json \
            --exit-zero --skip B101,B603,B607,B608,B311,B324
      - name: Enforce high-severity Bandit threshold
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path("bandit-report.json").read_text(encoding="utf-8"))
          findings = report.get("results", [])
          high = [item for item in findings if item.get("issue_severity", "").upper() == "HIGH"]
          print(f"Bandit findings retained: {len(findings)} total; {len(high)} high severity.")
          for item in high:
              print(
                  f"HIGH: {item.get('filename')}:{item.get('line_number')} "
                  f"{item.get('test_id')} — {item.get('issue_text')}"
              )
          sys.exit(1 if high else 0)
          PY
      - name: Dependency vulnerability audit
        run: pip-audit --local --format json --output pip-audit-report.json
      - name: Upload security artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json

# ── Build Package ─────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

# ── Publish to TestPyPI ───────────────────────────────────────────────────────
  publish-test:
    name: Publish → TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Runs on every push to master/main (not just releases)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: testpypi
    permissions:
      id-token: write   # OIDC trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

# ── Publish to PyPI (releases only) ──────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    runs-on: ubuntu-latest
    needs: build
    # Only runs when you create a GitHub Release or push a v* tag
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed!)
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# ── Docker Build ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push on PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: piyyy314/shadow313-nexus:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filter: ${{ (github.event_name == 'schedule' || github.event_name == 'release') && 'production' || '' }}
      - name: Login + push (release only)
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          no-cache-filter: production
          tags: |
            piyyy314/shadow313-nexus:latest
            piyyy314/shadow313-nexus:${{ github.event.release.tag_name }}
