# ═══════════════════════════════════════════════════════════════════════════════
# Shadow313 NEXUS — GitHub Actions CI/CD Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
name: Shadow313 CI/CD

on:
  push:
    branches: [main, master, develop, "feature/**", "feat/**"]
    tags: ["v*.*.*"]          # triggers PyPI publish
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  schedule:
    - cron: "0 3 * * 1"       # Weekly Monday 03:00 UTC
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  SHADOW313_AI_BACKEND: disabled
  SHADOW313_VERBOSE: "false"

# ── Lint & Format ─────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dev dependencies
        run: pip install ruff black mypy pyyaml rich
      - name: Record full-repository Ruff baseline
        run: |
          ruff check shadow313/ --output-format json > ruff-baseline.json || true
          python -c 'import json; from pathlib import Path; report=json.loads(Path("ruff-baseline.json").read_text()); print(f"Full-repository Ruff baseline: {len(report)} diagnostics")'
      - name: Ruff lint changed Python modules
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$GITHUB_BASE_REF"
          elif [[ "$GITHUB_REF" == refs/heads/feat/* || "$GITHUB_REF" == refs/heads/feature/* ]]; then
            base_ref="master"
          else
            base_ref=""
          fi
          if [ -n "$base_ref" ]; then
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            base="origin/$base_ref"
          else
            base="$(git rev-parse HEAD^)"
          fi
          changed_files="$(git diff --name-only "$base...HEAD" | grep -E '^shadow313/.*[.]py$' || true)"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs -r ruff check --output-format github
          else
            echo "No changed Shadow313 Python modules to lint."
          fi
      - name: Black format check changed Python modules
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$GITHUB_BASE_REF"
          elif [[ "$GITHUB_REF" == refs/heads/feat/* || "$GITHUB_REF" == refs/heads/feature/* ]]; then
            base_ref="master"
          else
            base_ref=""
          fi
          if [ -n "$base_ref" ]; then
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            base="origin/$base_ref"
          else
            base="$(git rev-parse HEAD^)"
          fi
          changed_files="$(git diff --name-only "$base...HEAD" | grep -E '^shadow313/.*[.]py$' || true)"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs -r black --check --diff
          else
            echo "No changed Shadow313 Python modules to format-check."
          fi
        continue-on-error: true
      - name: MyPy type check changed Python modules
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$GITHUB_BASE_REF"
          elif [[ "$GITHUB_REF" == refs/heads/feat/* || "$GITHUB_REF" == refs/heads/feature/* ]]; then
            base_ref="master"
          else
            base_ref=""
          fi
          if [ -n "$base_ref" ]; then
            git fetch --no-tags origin "+refs/heads/$base_ref:refs/remotes/origin/$base_ref"
            base="origin/$base_ref"
          else
            base="$(git rev-parse HEAD^)"
          fi
          changed_files="$(git diff --name-only "$base...HEAD" | grep -E '^shadow313/.*[.]py$' || true)"
          if [ -n "$changed_files" ]; then
            printf '%s\n' "$changed_files" | xargs -r mypy --ignore-missing-imports
          else
            echo "No changed Shadow313 Python modules to type-check."
          fi
      - name: Upload full-repository lint baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruff-repository-baseline
          path: ruff-baseline.json

# ── Unit Tests ────────────────────────────────────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Shadow313 + test deps
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx fastapi httpx uvicorn pytest-timeout \
            numpy scipy scapy dnspython python-whois cryptography \
            requests aiohttp sqlalchemy pydantic
      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/integration \
            --timeout=120 \
            -x
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          flags: unittests
        continue-on-error: true

# ── Security Self-Scan ────────────────────────────────────────────────────────
  shiatoali-postgres:
    name: ShiatoAli PostgreSQL Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shiatoali_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shiatoali_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SHIAATOALI_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/shiatoali_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL test dependencies
        run: pip install -e ".[dev]"
      - name: Apply ShiatoAli schema migration
        run: alembic -c alembic-shiatoali.ini upgrade head
      - name: Run real PostgreSQL integration tests
        run: pytest tests/integration/test_shiatoali_postgres.py -q --tb=short

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        run: |
          pip install --upgrade "setuptools>=84.1.0"
          pip install -e "." pyyaml rich bandit pip-audit
      - name: Bandit SAST scan
        run: |
          bandit -r shadow313/ -f json -o bandit-report.json --exit-zero \
            --skip B101,B603,B607,B608,B311,B324
      - name: Enforce high-severity Bandit findings
        run: |
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          findings = report.get("results", [])
          high = [item for item in findings if item.get("issue_severity") == "HIGH"]
          medium = [item for item in findings if item.get("issue_severity") == "MEDIUM"]
          print(f"Bandit findings: {len(high)} high, {len(medium)} medium, "
                f"{len(findings) - len(high) - len(medium)} low")
          for item in high:
              print(f"HIGH: {item['filename']}:{item['line_number']} "
                    f"{item['test_id']} {item['issue_text']}")
          if high:
              sys.exit(1)
          PY
      - name: Dependency vulnerability audit
        run: pip-audit --format json > dependency-report.json
      - name: Upload security artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            dependency-report.json

# ── Build Package ─────────────────────────────────────────────────────────────
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build tools
        run: pip install build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Check distribution
        run: twine check dist/*
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/
          retention-days: 7

# ── Publish to TestPyPI ───────────────────────────────────────────────────────
  publish-test:
    name: Publish → TestPyPI
    runs-on: ubuntu-latest
    needs: build
    # Runs on every push to master/main (not just releases)
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment: testpypi
    permissions:
      id-token: write   # OIDC trusted publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

# ── Publish to PyPI (releases only) ──────────────────────────────────────────
  publish-pypi:
    name: Publish → PyPI
    runs-on: ubuntu-latest
    needs: build
    # Only runs when you create a GitHub Release or push a v* tag
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed!)
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist-packages
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

# ── Docker Build ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Compose configuration
        run: |
          export WEBUI_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export SHADOW313_API_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker compose --env-file .env.example config --quiet
      - name: Validate Nginx routing configuration
        run: |
          mkdir -p "$RUNNER_TEMP/shadow313-ssl"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -keyout "$RUNNER_TEMP/shadow313-ssl/shadow313.key" \
            -out "$RUNNER_TEMP/shadow313-ssl/shadow313.crt" \
            -subj "/CN=localhost"
          docker run --rm \
            --add-host open-webui:127.0.0.1 \
            --add-host shadow313-api:127.0.0.1 \
            --add-host ollama:127.0.0.1 \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$RUNNER_TEMP/shadow313-ssl:/etc/nginx/ssl:ro" \
            nginx:alpine nginx -t
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image (no push on PR)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: piyyy314/shadow313-nexus:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Login + push (release only)
        if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push release image
        if: github.event_name == 'release'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            piyyy314/shadow313-nexus:latest
            piyyy314/shadow313-nexus:${{ github.event.release.tag_name }}
