name: Temporary Ruff Import Probe
on:
  push:
    branches:
      - fix/evidence-provenance-accuracy-20261122
jobs:
  import-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.4.4
      - run: ruff check --select I --fix --diff shadow313/v4/intelligence/evidence_envelope.py
