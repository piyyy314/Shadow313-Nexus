# Shadow313 NEXUS — PR Gate Checks
# Triggered: pull_request to master or develop
# All jobs run in parallel. All must pass for merge.

name: PR Checks

on:
  pull_request:
    branches:
      - master
      - develop
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

env:
  PYTHON_VERSION: "3.12"

jobs:

  # ── Changed-file lint ──────────────────────────────────────────────
  lint:
    name: Lint (Changed Python / YAML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linters
        run: pip install ruff black yamllint==1.35.1

      - name: Identify changed Python and YAML files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Pull request base SHA is required" >&2
            exit 1
          fi

          mapfile -t python_candidates < <(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- \
              'shadow313/*.py' 'shadow313/**/*.py' \
              'nexus_toolkit/*.py' 'nexus_toolkit/**/*.py'
          )
          python_files=()
          for file in "${python_candidates[@]}"; do
            if [ -f "$file" ]; then
              python_files+=("$file")
            fi
          done
          printf '%s\n' "${python_files[@]}" > "$RUNNER_TEMP/pr-python-files.txt"
          echo "python_count=${#python_files[@]}" >> "$GITHUB_OUTPUT"

          mapfile -t yaml_candidates < <(
            git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- '*.yml' '*.yaml'
          )
          yaml_files=()
          for file in "${yaml_candidates[@]}"; do
            if [ -f "$file" ]; then
              yaml_files+=("$file")
            fi
          done
          printf '%s\n' "${yaml_files[@]}" > "$RUNNER_TEMP/pr-yaml-files.txt"
          echo "yaml_count=${#yaml_files[@]}" >> "$GITHUB_OUTPUT"

      - name: Run Ruff on changed Python files
        if: steps.changed-files.outputs.python_count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/pr-python-files.txt"; ruff check "${files[@]}" --output-format github

      - name: Run Black on changed Python files
        if: steps.changed-files.outputs.python_count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/pr-python-files.txt"; black --check --diff "${files[@]}"

      - name: Run yamllint on changed YAML files
        if: steps.changed-files.outputs.yaml_count != '0'
        run: mapfile -t files < "$RUNNER_TEMP/pr-yaml-files.txt"; yamllint -c .yamllint.yml "${files[@]}"

  # ── Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python 3.11 / 3.12)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx fastapi httpx uvicorn

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/integration \
            -x

  # ── SAST ──────────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit==1.9.4

      - name: Run Bandit SAST (retain all severities)
        run: |
          bandit -r shadow313/ nexus_toolkit/ \
            -x shadow313/tests,tests \
            -f json -o bandit-report.json \
            --exit-zero

      - name: Enforce high-severity Bandit threshold
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("bandit-report.json")
          if not report_path.is_file():
              raise SystemExit("Bandit did not produce bandit-report.json")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          findings = report.get("results", [])
          high = [
              finding for finding in findings
              if finding.get("issue_severity") == "HIGH"
          ]
          for finding in high:
              print(
                  f"{finding.get('filename')}:{finding.get('line_number')}: "
                  f"{finding.get('issue_text')}"
              )
          if high:
              raise SystemExit(f"Bandit high-severity findings: {len(high)}")
          print(
              f"High-severity gate passed; {len(findings)} total findings "
              "retained in the artifact."
          )
          PY

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  # ── Secret Scan ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Gitleaks CLI
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan checked-out source tree with Gitleaks
        run: gitleaks dir --redact --exit-code 1 .

  # ── SCA ───────────────────────────────────────────────────────────
  sca:
    name: Dependency Scan (pip-audit + Safety)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Install project dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run pip-audit on installed project dependencies
        id: pip_audit
        continue-on-error: true
        run: |
          set +e
          pip-audit --local --skip-editable --desc --format json -o pip-audit-local-report.json
          local_status=$?
          pip-audit --desc --format json -o pip-audit-requirements-report.json -r requirements.txt
          requirements_status=$?
          set -e
          printf 'pip-audit local: %s\npip-audit requirements: %s\n' "$local_status" "$requirements_status"
          if [ "$local_status" -ne 0 ] || [ "$requirements_status" -ne 0 ]; then
            exit 1
          fi

      - name: Freeze resolved application dependencies for Safety
        run: python -m pip freeze --exclude-editable > requirements-audit-resolved.txt

      - name: Upload pip-audit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-reports
          path: |
            pip-audit-local-report.json
            pip-audit-requirements-report.json
            requirements-audit-resolved.txt
          retention-days: 7
          if-no-files-found: warn

      - name: Run Safety check against resolved application dependencies
        id: safety_scan
        continue-on-error: true
        run: |
          python -m venv "$RUNNER_TEMP/safety-env"
          "$RUNNER_TEMP/safety-env/bin/python" -m pip install --disable-pip-version-check safety==3.8.1
          "$RUNNER_TEMP/safety-env/bin/safety" check --full-report --check-unpinned-requirements -r requirements-audit-resolved.txt

      - name: Enforce dependency audit results
        if: always()
        env:
          PIP_AUDIT_OUTCOME: ${{ steps.pip_audit.outcome }}
          SAFETY_OUTCOME: ${{ steps.safety_scan.outcome }}
        run: |
          printf 'pip-audit: %s\nSafety: %s\n' "$PIP_AUDIT_OUTCOME" "$SAFETY_OUTCOME"
          if [ "$PIP_AUDIT_OUTCOME" != "success" ] || [ "$SAFETY_OUTCOME" != "success" ]; then
            echo "At least one dependency scanner failed or reported findings." >&2
            exit 1
          fi

  # ── Docker Lint ───────────────────────────────────────────────────
  docker-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
