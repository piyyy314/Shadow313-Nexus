# Shadow313 NEXUS — PR Gate Checks
# Triggered: pull_request to every branch
# All jobs run in parallel. All must pass for merge.

name: PR Checks

on:
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened]
  push:
    branches:
      - 'fix/**'
      - 'claude/**'

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write
  checks: write

env:
  GH_TOKEN: ${{ github.token }}
  PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  PYTHON_VERSION: "3.12"

jobs:

  # Required gates cover PR changes; full-tree reports are retained by security-scan.yml.
  # ── Lint ──────────────────────────────────────────────────────────
  lint:
    name: Lint (Python / YAML / Markdown)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve current PR base SHA
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          echo "BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linters
        run: pip install ruff==0.4.4 black==24.3.0 yamllint==1.35.1

      - name: Run Ruff on changed Python files
        run: |
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
              while IFS= read -r path; do printf '%s\0' "$path"; done > "$changed_files"
          else
            PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:$GITHUB_REF_NAME" --jq '.[0].number // empty')"
            if [[ -n "$PR_NUMBER" ]]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
                while IFS= read -r path; do printf '%s\\0' "$path"; done > "$changed_files"
            else
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
            fi
          fi
          files=()
          while IFS= read -r -d '' path; do
            [[ "$path" =~ ^(shadow313|nexus_toolkit)/.*\.py$ ]] || continue
            files+=("$path")
          done < "$changed_files"
          if ((${#files[@]})); then
            ruff check "${files[@]}" --output-format github
          else
            echo "No changed Python files to lint."
          fi

      - name: Run Black on changed Shadow313 files
        run: |
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
              while IFS= read -r path; do printf '%s\0' "$path"; done > "$changed_files"
          else
            PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:$GITHUB_REF_NAME" --jq '.[0].number // empty')"
            if [[ -n "$PR_NUMBER" ]]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
                while IFS= read -r path; do printf '%s\\0' "$path"; done > "$changed_files"
            else
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
            fi
          fi
          files=()
          while IFS= read -r -d '' path; do
            [[ "$path" =~ ^shadow313/.*\.py$ ]] || continue
            files+=("$path")
          done < "$changed_files"
          if ((${#files[@]})); then
            black --check --diff "${files[@]}"
          else
            echo "No changed Shadow313 Python files to format-check."
          fi

      - name: Run yamllint on changed workflow files
        run: |
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
              while IFS= read -r path; do printf '%s\0' "$path"; done > "$changed_files"
          else
            PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:$GITHUB_REF_NAME" --jq '.[0].number // empty')"
            if [[ -n "$PR_NUMBER" ]]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
                while IFS= read -r path; do printf '%s\\0' "$path"; done > "$changed_files"
            else
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
            fi
          fi
          files=()
          while IFS= read -r -d '' path; do
            [[ "$path" =~ ^\.github/workflows/.*\.ya?ml$ || "$path" == "docker-compose.yml" ]] || continue
            files+=("$path")
          done < "$changed_files"
          if ((${#files[@]})); then
            yamllint -c .yamllint.yml "${files[@]}"
          else
            echo "No changed YAML files to lint."
          fi

  # ── Unit Tests ────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Python 3.11 / 3.12)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install pyyaml rich pytest-asyncio pyspx fastapi httpx uvicorn

      - name: Run tests
        run: |
          pytest tests/ -q --tb=short \
            --ignore=tests/integration \
            -x

  # ── SAST ──────────────────────────────────────────────────────────
  sast:
    name: SAST (Bandit + Semgrep)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve current PR base SHA
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          echo "BASE_SHA=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit==1.7.8

      - name: Run Bandit on changed Python files
        run: |
          changed_files=$(mktemp)
          trap 'rm -f "$changed_files"' EXIT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
              while IFS= read -r path; do printf '%s\0' "$path"; done > "$changed_files"
          else
            PR_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY:$GITHUB_REF_NAME" --jq '.[0].number // empty')"
            if [[ -n "$PR_NUMBER" ]]; then
              gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename' |
                while IFS= read -r path; do printf '%s\\0' "$path"; done > "$changed_files"
            else
              git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$GITHUB_SHA" > "$changed_files"
            fi
          fi
          files=()
          while IFS= read -r -d '' path; do
            [[ "$path" =~ ^(shadow313|nexus_toolkit)/.*\.py$ ]] || continue
            if [[ "$path" =~ (^|/)tests/ ]]; then
              continue
            fi
            files+=("$path")
          done < "$changed_files"
          if ((${#files[@]})); then
            bandit --severity-level medium -f json -o bandit-report.json "${files[@]}"
          else
            printf '{"results": [], "metrics": {}}\n' > bandit-report.json
            echo "No changed production Python files to scan."
          fi

      - name: Upload Bandit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bandit-report-${{ matrix.python-version || 'default' }}
          path: bandit-report.json
          retention-days: 7

  # ── Secret Scan ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  # ── SCA ───────────────────────────────────────────────────────────
  sca:
    name: Dependency Scan (pip-audit + Safety)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install project dependencies
        run: pip install -e ".[dev]"

      - name: Snapshot project dependencies
        run: pip freeze --exclude-editable > safety-requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Run pip-audit
        run: |
          pip-audit --desc --format json -o pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run Safety check
        run: |
          python -m venv .safety-venv
          .safety-venv/bin/python -m pip install \
            safety==3.8.1
          .safety-venv/bin/safety check --full-report --file safety-requirements.txt

  # ── Docker Lint ───────────────────────────────────────────────────
  docker-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
