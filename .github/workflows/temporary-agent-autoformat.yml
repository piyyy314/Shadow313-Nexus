name: Temporary Agent Autoformat
on:
  push:
    branches:
      - fix/agent-dispatch-fail-closed
permissions:
  contents: write
jobs:
  format-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-dispatch-fail-closed
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.17.6 black==26.10.1
      - name: Correct agent module structure and diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("shadow313/v2/agent/agent.py")
          source = path.read_text(encoding="utf-8")
          source = source.replace(
              'from __future__ import annotations\n"""',
              '"""',
              1,
          )
          source = source.replace(
              'with human-in-the-loop approval gates, step logging, and rollback capability.\n"""\nimport json',
              'with human-in-the-loop approval gates, step logging, and rollback capability.\n"""\n\nfrom __future__ import annotations\n\nimport json',
              1,
          )
          source = source.replace(
              'import json\nimport time\nimport uuid\nfrom dataclasses import dataclass, field, asdict\nfrom datetime import datetime, timezone\nfrom enum import Enum\nfrom pathlib import Path\nfrom typing import Any, Callable\nimport logging\nlogger = logging.getLogger(__name__)',
              'import json\nimport logging\nimport re\nimport time\nimport uuid\nfrom collections.abc import Callable\nfrom dataclasses import asdict, dataclass, field\nfrom datetime import UTC, datetime\nfrom enum import StrEnum\nfrom pathlib import Path\nfrom typing import Any\n\nlogger = logging.getLogger(__name__)',
              1,
          )
          source = source.replace('class StepStatus(str, Enum):', 'class StepStatus(StrEnum):')
          source = source.replace('class ApprovalPolicy(str, Enum):', 'class ApprovalPolicy(StrEnum):')
          source = source.replace('datetime.now(timezone.utc)', 'datetime.now(UTC)')
          source = source.replace('''        try:
              import re
              m = re.search(r'\\[.*?\\]', raw, re.DOTALL)
              if m:
                  return json.loads(m.group())
          except Exception:
              pass''','''        try:
              match = re.search(r'\\[.*?\\]', raw, re.DOTALL)
              if match:
                  return json.loads(match.group())
          except (json.JSONDecodeError, re.error) as exc:
              logger.debug("AI plan suggestion parsing failed: %s", exc)''')
          source = source.replace('''            except Exception:
                  pass
          return sorted(plans, key=lambda x: x.get("created_at",""), reverse=True)''','''            except (OSError, json.JSONDecodeError) as exc:
                  logger.warning("Could not load agent plan %s: %s", f, exc)
          return sorted(plans, key=lambda x: x.get("created_at", ""), reverse=True)''')
          path.write_text(source, encoding="utf-8")
          PY
      - name: Apply Ruff fixes and Black formatting
        run: |
          ruff check --fix --unsafe-fixes shadow313/v2/agent/agent.py
          black shadow313/v2/agent/agent.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shadow313/v2/agent/agent.py
          if git diff --cached --quiet; then
            echo "Agent source is already formatted."
          else
            git commit -m "style(agent): apply Ruff and Black formatting"
            git push origin HEAD:fix/agent-dispatch-fail-closed
          fi
