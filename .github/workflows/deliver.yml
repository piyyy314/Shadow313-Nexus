# Shadow313 NEXUS — Automated Delivery Pipeline
# Publishes the versioned dist/ delivery portal and commits the exact same records.

name: Delivery Pipeline

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'shadow313/**'
      - 'scripts/delivery/**'
  workflow_dispatch:

concurrency:
  group: shadow313-delivery-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & Version Artifacts
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    outputs:
      delivery_id: ${{ steps.pipeline.outputs.delivery_id }}
      version: ${{ steps.pipeline.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Shadow313
        run: python -m pip install -e "." -q

      - name: Run delivery pipeline once
        id: pipeline
        run: |
          python3 - << 'PYEOF'
          import json
          import os
          import sys

          sys.path.insert(0, ".")
          from scripts.delivery.pipeline import (
              DIST_DIR,
              MANIFEST,
              RECEIPT_DIR,
              build_index,
              create_delivery_receipt,
              generate_manifest,
              scan_deliverables,
          )

          DIST_DIR.mkdir(exist_ok=True)
          RECEIPT_DIR.mkdir(exist_ok=True)

          files = scan_deliverables()
          manifest = generate_manifest(files)
          receipt = create_delivery_receipt(manifest)
          index = build_index(manifest, 8313)

          MANIFEST.write_text(json.dumps(manifest, indent=2, default=str), encoding="utf-8")
          (DIST_DIR / "index.html").write_text(index, encoding="utf-8")
          (RECEIPT_DIR / f"{receipt['bind_id']}.json").write_text(
              json.dumps(receipt, indent=2, default=str),
              encoding="utf-8",
          )

          print(f"Delivery ID: {manifest['delivery_id']}")
          print(f"Files: {manifest['total_files']}")
          print(f"Version: {manifest['platform_version']}")
          print(f"Git SHA: {manifest['git_sha']}")
          print(f"Receipt: {receipt['bind_id']}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"delivery_id={manifest['delivery_id']}\n")
              output.write(f"version={manifest['platform_version']}\n")
          PYEOF

      - name: Upload complete delivery artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: s313-nexus-delivery-${{ github.sha }}
          path: |
            dist/
            docs/*.html
            docs/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact manifest and receipt records for repository commit
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-records-${{ github.run_id }}
          path: |
            dist/manifest.json
            dist/receipts/
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy-pages:
    name: Deploy delivery portal to GitHub Pages
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages delivery portal
        id: deployment
        uses: actions/deploy-pages@v5

  commit-manifest:
    name: Commit the same manifest and receipts
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Download the exact records used by the Pages artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: delivery-records-${{ github.run_id }}
          path: dist/

      - name: Commit generated records without rewriting history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dist/manifest.json dist/receipts/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No delivery-record changes to commit."
          else
            git commit -m "chore(delivery): record ${{ needs.build.outputs.delivery_id }} [skip ci]"
            git push origin HEAD:master
          fi
