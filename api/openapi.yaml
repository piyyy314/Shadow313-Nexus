openapi: "3.1.0"
info:
  title: Shadow313 NEXUS API
  description: >-
    Local-First AI-Powered Security Intelligence REST API. This contract describes
    the separately hosted Python backend, not the static website. The static-site
    adapter returns HTTP 200 with an explicit unavailable status for backend-dependent
    routes and never fabricates scan results.
  version: "4.0.0"
  contact:
    name: Shadow313 Core Team
    email: ops@shadow313.dev
    url: https://shadow313.dev
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: http://localhost:8313
    description: Local development

paths:
  /api/status:
    get:
      summary: Python API status
      operationId: getPythonApiStatus
      responses:
        "200":
          description: API operational

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      servers:
        - url: http://localhost:8313
      responses:
        "200":
          description: Healthy

  /api/modules:
    get:
      summary: List available modules
      operationId: listModules
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Module list
        "401":
          description: Unauthorized

  /api/detect:
    post:
      summary: Run threat detection
      operationId: detect
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: object
                  additionalProperties: true
                detectors:
                  type: array
                  items: {type: string}
                  default: [all]
      responses:
        "200":
          description: Detection results
        "401":
          description: Unauthorized

  /api/webshell/scan:
    post:
      summary: Scan for web shells
      operationId: webshellScan
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
                file_path: {type: string}
                mode: {type: string, enum: [content, access_log], default: content}
      responses:
        "200":
          description: Web-shell detector results
        "401":
          description: Unauthorized

  /api/attck/coverage:
    get:
      summary: ATT&CK coverage matrix
      operationId: attckCoverage
      responses:
        "200":
          description: Coverage data

  /api/bind/create:
    post:
      summary: Create 313-BIND receipt
      operationId: createBind
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: object
                  additionalProperties: true
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Unsigned SHA3-512 demo receipt stored in process memory
        "401":
          description: Unauthorized
        "503":
          description: In-memory receipt store is full

  /api/bind/{bind_id}:
    get:
      summary: Get bind receipt
      operationId: getBind
      security:
        - ApiKeyAuth: []
      parameters:
        - name: bind_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Receipt data
        "404":
          description: Not found

  /api/bind:
    get:
      summary: List bind receipts
      operationId: listBinds
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Receipt list

  /api/mobile/status:
    get:
      summary: Mobile API status
      operationId: mobileStatus
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Mobile service status; unavailable when no mobile backend is connected
        "401":
          description: Unauthorized

  /api/audit:
    get:
      summary: Audit log
      operationId: getAuditLog
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit data status; unavailable when no persisted audit backend is connected
        "401":
          description: Unauthorized

  /api/audit/chain:
    get:
      summary: Audit chain integrity
      operationId: getAuditChain
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit-chain status; unavailable when no persisted audit backend is connected
        "401":
          description: Unauthorized

  /api/scan/recon:
    post:
      summary: Run an authorized reconnaissance scan
      operationId: scanRecon
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string}
                mode: {type: string, default: passive}
                ports: {type: string}
      responses:
        "200": {description: Scan status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/scan/vuln:
    post:
      summary: Run vulnerability analysis on an authorized target
      operationId: scanVulnerabilities
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: {type: string}
                cve_id: {type: string}
                from_session: {type: string}
      responses:
        "200": {description: Analysis status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/mobile/scan:
    post:
      summary: Submit a mobile scan request
      operationId: mobileScan
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Scan status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/mobile/alerts:
    get:
      summary: List mobile alerts
      operationId: listMobileAlerts
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Alert data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/mobile/findings:
    get:
      summary: List mobile findings
      operationId: listMobileFindings
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Finding data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/mobile/sessions:
    get:
      summary: List mobile sessions
      operationId: listMobileSessions
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Session data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/stream:
    get:
      summary: Subscribe to event stream
      operationId: streamEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Stream status; unavailable when no event backend is connected}
        "401": {description: Unauthorized}

  /api/events:
    get:
      summary: List API events
      operationId: listEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Event data status; unavailable when no event backend is connected}
        "401": {description: Unauthorized}


  /api/chat:
    post:
      summary: Run a response through the configured AI backend
      operationId: chat
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  minLength: 1
                  maxLength: 20000
                system_prompt:
                  type: string
                  nullable: true
                  maxLength: 4000
                context:
                  type: object
                  nullable: true
                  additionalProperties: true
      responses:
        "200":
          description: Generated response from the configured AI backend
        "401":
          description: Unauthorized
        "422":
          description: Invalid request
        "502":
          description: AI provider request failed
        "503":
          description: AI backend is disabled or unavailable

  /api/shiatoali/health:
    get:
      summary: ShiatoAli SOC service health
      operationId: shiatoAliHealth
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: SOC service health and storage status
        "401":
          description: Unauthorized

  /api/shiatoali/events:
    get:
      summary: List ingested SOC events
      operationId: listShiatoAliEvents
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Paginated SOC event records
        "401":
          description: Unauthorized
        "422":
          description: Invalid pagination parameters
    post:
      summary: Ingest a SOC event
      operationId: ingestShiatoAliEvent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, host, event_type, message]
              properties:
                source: {type: string, minLength: 1, maxLength: 100}
                host: {type: string, minLength: 1, maxLength: 255}
                event_type: {type: string, minLength: 1, maxLength: 100}
                message: {type: string, minLength: 1, maxLength: 20000}
                severity: {type: string, default: low}
                username: {type: string, nullable: true, maxLength: 255}
                src_ip: {type: string, nullable: true, maxLength: 64}
                timestamp: {type: string, nullable: true}
                event_id: {type: string, nullable: true, maxLength: 100}
                raw:
                  type: object
                  additionalProperties: true
      responses:
        "202":
          description: Event accepted and processed
        "401":
          description: Unauthorized
        "422":
          description: Invalid event payload

  /api/shiatoali/alerts:
    get:
      summary: List generated SOC alerts
      operationId: listShiatoAliAlerts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
        - name: since
          in: query
          required: false
          schema: {type: string, format: date-time, nullable: true}
        - name: order
          in: query
          required: false
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        "200":
          description: Paginated SOC alert records
        "401":
          description: Unauthorized
        "422":
          description: Invalid alert query parameters

  /api/shiatoali/cases:
    get:
      summary: List SOC cases
      operationId: listShiatoAliCases
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Paginated SOC cases
        "401":
          description: Unauthorized
        "422":
          description: Invalid pagination parameters
    post:
      summary: Create a SOC case
      operationId: createShiatoAliCase
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              additionalProperties: false
              properties:
                title: {type: string, minLength: 1, maxLength: 255}
                description: {type: string, maxLength: 10000, default: ""}
                priority: {type: string, default: medium}
                alert_id: {type: string, nullable: true}
      responses:
        "201":
          description: SOC case created; actor is assigned by the authenticated API dependency
        "401":
          description: Unauthorized
        "422":
          description: Invalid case payload

  /api/shiatoali/cases/{case_id}:
    get:
      summary: Retrieve a SOC case
      operationId: getShiatoAliCase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: SOC case details and activity
        "401":
          description: Unauthorized
        "404":
          description: Case not found
    patch:
      summary: Update a SOC case
      operationId: updateShiatoAliCase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: {type: string, nullable: true}
                assignee: {type: string, nullable: true, maxLength: 255}
                note: {type: string, nullable: true, maxLength: 5000}
      responses:
        "200":
          description: Updated SOC case and activity record
        "401":
          description: Unauthorized
        "404":
          description: Case not found
        "422":
          description: Invalid case update

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
