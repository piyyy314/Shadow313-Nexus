openapi: "3.1.0"
info:
  title: Shadow313 NEXUS API
  description: >-
    Local-First AI-Powered Security Intelligence REST API. This contract describes
    the separately hosted Python backend, not the static website. The static-site
    adapter returns HTTP 503 for backend-dependent routes.
  version: "4.0.0"
  contact:
    name: Shadow313 Core Team
    email: ops@shadow313.dev
    url: https://shadow313.dev
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: http://localhost:8313
    description: Local development

paths:
  /api/status:
    get:
      summary: Python API status
      operationId: getPythonApiStatus
      responses:
        "200":
          description: API operational

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      servers:
        - url: http://localhost:8313
      responses:
        "200":
          description: Healthy

  /api/modules:
    get:
      summary: List available modules
      operationId: listModules
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Module list
        "401":
          description: Unauthorized

  /api/detect:
    post:
      summary: Run threat detection
      operationId: detect
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events: {type: array}
                session_id: {type: string}
      responses:
        "200":
          description: Detection results
        "401":
          description: Unauthorized

  /api/webshell/scan:
    post:
      summary: Scan for web shells
      operationId: webshellScan
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Scan results

  /api/attck/coverage:
    get:
      summary: ATT&CK coverage matrix
      operationId: attckCoverage
      responses:
        "200":
          description: Coverage data

  /api/bind/create:
    post:
      summary: Create 313-BIND receipt
      operationId: createBind
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Receipt created

  /api/bind/{bind_id}:
    get:
      summary: Get bind receipt
      operationId: getBind
      parameters:
        - name: bind_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Receipt data
        "404":
          description: Not found

  /api/bind:
    get:
      summary: List bind receipts
      operationId: listBinds
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Receipt list

  /api/mobile/status:
    get:
      summary: Mobile API status
      operationId: mobileStatus
      responses:
        "200":
          description: Mobile status

  /api/audit:
    get:
      summary: Audit log
      operationId: getAuditLog
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit entries

  /api/audit/chain:
    get:
      summary: Audit chain integrity
      operationId: getAuditChain
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Chain status

  /api/scan/recon:
    post:
      summary: Run an authorized reconnaissance scan
      operationId: scanRecon
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: string}
                mode: {type: string, default: passive}
                ports: {type: string}
      responses:
        "200": {description: Scan results}
        "401": {description: Unauthorized}

  /api/scan/vuln:
    post:
      summary: Run vulnerability analysis on an authorized target
      operationId: scanVulnerabilities
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target: {type: string}
                cve_id: {type: string}
                from_session: {type: string}
      responses:
        "200": {description: Analysis results}
        "401": {description: Unauthorized}

  /api/mobile/scan:
    post:
      summary: Submit a mobile scan request
      operationId: mobileScan
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Scan accepted}
        "401": {description: Unauthorized}

  /api/mobile/alerts:
    get:
      summary: List mobile alerts
      operationId: listMobileAlerts
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Alert list}

  /api/mobile/findings:
    get:
      summary: List mobile findings
      operationId: listMobileFindings
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Finding list}

  /api/mobile/sessions:
    get:
      summary: List mobile sessions
      operationId: listMobileSessions
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Session list}

  /api/stream:
    get:
      summary: Subscribe to event stream
      operationId: streamEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Event stream}

  /api/events:
    get:
      summary: List API events
      operationId: listEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Event list}

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
