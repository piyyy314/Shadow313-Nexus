# ══════════════════════════════════════════════════════════════════
# Shadow313 NEXUS — Nginx Reverse Proxy Configuration
# Routes: Open WebUI (3000) · Shadow313 Dashboard (7313) · Ollama API (11434)
# ══════════════════════════════════════════════════════════════════

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ── Rate limiting ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=ui:10m  rate=60r/m;

    # ── Upstream definitions ──────────────────────────────────────────
    upstream openwebui {
        server open-webui:3000;
        keepalive 32;
    }

    upstream shadow313_dashboard {
        server shadow313-dashboard:7313;
        keepalive 16;
    }

    upstream ollama_api {
        server ollama:11434;
        keepalive 16;
    }

    upstream shadow313_api {
        server shadow313-api:8313;
        keepalive 16;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name localhost shadow313.local;

        # Self-signed cert for local dev (replace with real cert for production)
        ssl_certificate     /etc/nginx/ssl/shadow313.crt;
        ssl_certificate_key /etc/nginx/ssl/shadow313.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        client_max_body_size 100M;

        # ── Open WebUI (default — AI chat interface) ──────────────────
        location / {
            limit_req zone=ui burst=20 nodelay;
            proxy_pass         http://openwebui;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # ── Shadow313 Dashboard ───────────────────────────────────────
        location /dashboard/ {
            limit_req zone=ui burst=10 nodelay;
            proxy_pass         http://shadow313_dashboard/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Shadow313 REST API ────────────────────────────────────────
        location /api/s313/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://shadow313_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # ── Ollama API (internal only — no external exposure) ─────────
        location /api/ollama/ {
            # Block external access — only allow from Docker network
            allow 172.20.0.0/16;
            allow 172.21.0.0/16;
            allow 127.0.0.1;
            deny all;

            limit_req zone=api burst=5 nodelay;
            proxy_pass         http://ollama_api/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 600s;  # LLM inference can be slow
            proxy_send_timeout 600s;
        }

        # ── Health check endpoint ─────────────────────────────────────
        location /health {
            access_log off;
            return 200 '{"status":"ok","service":"shadow313-nexus"}';
            add_header Content-Type application/json;
        }

        # ── Static assets ─────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            proxy_pass http://openwebui;
        }
    }

    # ── Dev HTTP server (no TLS — for local WSL2 testing) ────────────
    server {
        listen 8080;
        server_name localhost;

        # Open WebUI
        location / {
            proxy_pass         http://openwebui;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
        }

        # Shadow313 Dashboard
        location /dashboard/ {
            proxy_pass http://shadow313_dashboard/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health
        location /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }
    }
}