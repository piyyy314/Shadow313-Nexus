openapi: "3.1.0"
info:
  title: Shadow313 NEXUS API
  description: >-
    Local-First AI-Powered Security Intelligence REST API. This contract describes
    the separately hosted Python backend, not the static website. The static-site
    adapter returns HTTP 200 with an explicit unavailable status for backend-dependent
    routes and never fabricates scan results.
  version: "4.0.0"
  contact:
    name: Shadow313 Core Team
    email: ops@shadow313.dev
    url: https://shadow313.dev
  license:
    name: MIT
    url: https://opensource.org/license/mit

servers:
  - url: http://localhost:8313
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  /api/status:
    get:
      summary: Python API status
      operationId: getPythonApiStatus
      security: []
      responses:
        "200":
          description: Service health, local module inventory, and remote API endpoint capability status

  /health:
    get:
      summary: Health check
      operationId: healthCheck
      servers:
        - url: http://localhost:8313
      security: []
      responses:
        "200":
          description: Healthy

  /api/modules:
    get:
      summary: List available modules
      operationId: listModules
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Module list
        "401":
          description: Unauthorized

  /api/chat:
    post:
      summary: Generate a response with the configured AI backend
      operationId: chat
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt: {type: string, minLength: 1, maxLength: 20000}
                system_prompt: {type: [string, "null"], maxLength: 4000}
                context: {type: [object, "null"], additionalProperties: true}
      responses:
        "200":
          description: AI-generated response
        "401":
          description: Unauthorized
        "502":
          description: AI provider request failed
        "503":
          description: AI backend disabled or unavailable

  /api/detect:
    post:
      summary: Run threat detection
      operationId: detect
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event: {type: object, additionalProperties: true}
                detectors:
                  type: array
                  items: {type: string}
                  default: [all]
      responses:
        "200":
          description: Detection results
        "401":
          description: Unauthorized

  /api/webshell/scan:
    post:
      summary: Scan for web shells
      operationId: webshellScan
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string}
                file_path: {type: [string, "null"]}
                mode: {type: string, enum: [content, access_log], default: content}
      responses:
        "200":
          description: Web-shell scan results
        "401":
          description: Unauthorized

  /api/attck/coverage:
    get:
      summary: ATT&CK coverage matrix
      operationId: attckCoverage
      responses:
        "200":
          description: Coverage data

  /api/bind/create:
    post:
      summary: Create 313-BIND receipt
      operationId: createBind
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: {type: object, additionalProperties: true}
                metadata: {type: [object, "null"], additionalProperties: true}
      responses:
        "200":
          description: Receipt created

  /api/bind/{bind_id}:
    get:
      summary: Get bind receipt
      operationId: getBind
      parameters:
        - name: bind_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Receipt data
        "404":
          description: Not found

  /api/bind:
    get:
      summary: List bind receipts
      operationId: listBinds
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Receipt list

  /api/mobile/status:
    get:
      summary: Mobile API status
      operationId: mobileStatus
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Mobile service status; unavailable when no mobile backend is connected
        "401":
          description: Unauthorized

  /api/audit:
    get:
      summary: Audit log
      operationId: getAuditLog
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit data status; unavailable when no persisted audit backend is connected
        "401":
          description: Unauthorized

  /api/audit/chain:
    get:
      summary: Audit chain integrity
      operationId: getAuditChain
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Audit-chain status; unavailable when no persisted audit backend is connected
        "401":
          description: Unauthorized

  /api/scan/recon:
    post:
      summary: Reserved reconnaissance scan endpoint (currently unavailable)
      description: No remote scan worker is connected. Use the local CLI for authorized scans.
      operationId: scanRecon
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Scan status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/scan/vuln:
    post:
      summary: Reserved vulnerability scan endpoint (currently unavailable)
      description: No remote scan worker is connected. Use the local CLI for authorized analysis.
      operationId: scanVulnerabilities
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Analysis status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/mobile/scan:
    post:
      summary: Submit a mobile scan request
      operationId: mobileScan
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Scan status; unavailable when no remote worker is connected}
        "401": {description: Unauthorized}

  /api/mobile/alerts:
    get:
      summary: List mobile alerts
      operationId: listMobileAlerts
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Alert data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/mobile/findings:
    get:
      summary: List mobile findings
      operationId: listMobileFindings
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Finding data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/mobile/sessions:
    get:
      summary: List mobile sessions
      operationId: listMobileSessions
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Session data status; unavailable when no mobile backend is connected}
        "401": {description: Unauthorized}

  /api/stream:
    get:
      summary: Subscribe to event stream
      operationId: streamEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Stream status; unavailable when no event backend is connected}
        "401": {description: Unauthorized}

  /api/events:
    get:
      summary: List API events
      operationId: listEvents
      security:
        - ApiKeyAuth: []
      responses:
        "200": {description: Event data status; unavailable when no event backend is connected}
        "401": {description: Unauthorized}

  /api/shiatoali/health:
    get:
      summary: ShiatoAli SOC service health and record counts
      operationId: shiatoaliHealth
      security:
        - ApiKeyAuth: []
      responses:
        "200":
          description: Local SOC event store health
        "401":
          description: Unauthorized

  /api/shiatoali/events:
    get:
      summary: List normalized security events
      operationId: shiatoaliListEvents
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Stored event page
        "401":
          description: Unauthorized
    post:
      summary: Ingest and evaluate one normalized security event
      operationId: shiatoaliIngestEvent
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, host, event_type, message]
              properties:
                source: {type: string, maxLength: 100}
                host: {type: string, maxLength: 255}
                event_type: {type: string, maxLength: 100}
                message: {type: string, maxLength: 20000}
                severity: {type: string, enum: [informational, low, medium, high, critical]}
                username: {type: [string, "null"]}
                src_ip: {type: [string, "null"]}
                timestamp: {type: [string, "null"], format: date-time}
                event_id: {type: [string, "null"]}
                raw: {type: object}
      responses:
        "202":
          description: Event accepted or identified as a duplicate
        "401":
          description: Unauthorized
        "422":
          description: Invalid event

  /api/shiatoali/cases:
    get:
      summary: List analyst cases
      operationId: shiatoaliListCases
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200": {description: Analyst case page}
        "401": {description: Unauthorized}
    post:
      summary: Create an analyst case, optionally linked to an alert
      description: The creator is assigned by the API from the authenticated credential. A shared API key does not identify an individual human analyst.
      operationId: shiatoaliCreateCase
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, maxLength: 255}
                description: {type: string, maxLength: 10000}
                priority: {type: string, enum: [low, medium, high, critical]}
                alert_id: {type: [string, "null"]}
      responses:
        "201": {description: Case created}
        "401": {description: Unauthorized}
        "422": {description: Invalid case data}

  /api/shiatoali/cases/{case_id}:
    get:
      summary: Retrieve case details, linked alerts, and activity
      operationId: shiatoaliGetCase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200": {description: Case details}
        "401": {description: Unauthorized}
        "404": {description: Case not found}
    patch:
      summary: Update case status or assignee and append an analyst note
      description: The activity actor is assigned by the API from the authenticated credential; client-supplied actor values are rejected.
      operationId: shiatoaliUpdateCase
      security:
        - ApiKeyAuth: []
      parameters:
        - name: case_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: {type: string, enum: [open, investigating, contained, resolved, closed]}
                assignee: {type: [string, "null"]}
                note: {type: [string, "null"], maxLength: 5000}
      responses:
        "200": {description: Case updated}
        "401": {description: Unauthorized}
        "404": {description: Case not found}
        "422": {description: Invalid update}

  /api/shiatoali/alerts:
    get:
      summary: List alerts generated by ShiatoAli detections
      operationId: shiatoaliListAlerts
      security:
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: since
          in: query
          description: Return alerts created at or after this ISO-8601 timestamp
          schema: {type: string, format: date-time}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: desc}
      responses:
        "200":
          description: Stored alert page
        "401":
          description: Unauthorized

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
