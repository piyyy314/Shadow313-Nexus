<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S313 NEXUS — Real-Time Threat Board</title>
<style>

  :root {
    --bg:#020617; --bg2:#0b1329; --bg3:#0f1f3d;
    --green:#22c55e; --red:#ef4444; --amber:#f59e0b;
    --cyan:#06b6d4; --purple:#a78bfa; --blue:#3b82f6;
    --border:rgba(34,197,94,0.12); --text:#e2e8f0; --muted:#64748b;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Space Grotesk',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .mono { font-family:'JetBrains Mono',monospace; }

  /* ── Header ── */
  .header { background:rgba(2,6,23,0.98); border-bottom:1px solid var(--border);
    padding:0 20px; height:52px; display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:100; backdrop-filter:blur(14px); }
  .logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
  .logo-icon { width:30px; height:30px; background:var(--green); border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-weight:900;
    color:#000; font-size:11px; font-family:'JetBrains Mono',monospace; }
  .header-title { font-size:12px; font-family:'JetBrains Mono',monospace;
    color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  .session-info { margin-left:auto; font-size:10px; font-family:'JetBrains Mono',monospace;
    color:var(--muted); display:flex; gap:16px; align-items:center; }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green);
    animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.4)}
    50%{opacity:.7;box-shadow:0 0 0 6px rgba(34,197,94,0)} }

  /* ── KPI bar ── */
  .kpi-bar { display:flex; gap:12px; padding:12px 20px;
    background:var(--bg2); border-bottom:1px solid var(--border); }
  .kpi { background:var(--bg); border:1px solid rgba(30,41,59,.8);
    border-radius:8px; padding:10px 16px; flex:1; position:relative; overflow:hidden; }
  .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; }
  .kpi.crit::before { background:var(--red); }
  .kpi.high::before { background:var(--amber); }
  .kpi.med::before  { background:var(--cyan); }
  .kpi.low::before  { background:var(--muted); }
  .kpi-label { font-size:9px; font-weight:700; text-transform:uppercase;
    letter-spacing:.08em; color:var(--muted); font-family:'JetBrains Mono',monospace; }
  .kpi-val { font-size:28px; font-weight:700; line-height:1.1; margin-top:2px; }
  .kpi.crit .kpi-val { color:var(--red); }
  .kpi.high .kpi-val { color:var(--amber); }
  .kpi.med  .kpi-val { color:var(--cyan); }
  .kpi.low  .kpi-val { color:var(--muted); }

  /* ── Controls ── */
  .controls { display:flex; align-items:center; gap:10px; padding:10px 20px;
    background:var(--bg2); border-bottom:1px solid var(--border); }
  .search { flex:1; background:var(--bg); border:1px solid rgba(30,41,59,.8);
    border-radius:6px; padding:7px 12px; color:var(--text); font-size:12px;
    font-family:'Space Grotesk',sans-serif; outline:none; }
  .search:focus { border-color:rgba(34,197,94,.4); }
  .btn { padding:7px 14px; border-radius:6px; font-size:11px; font-weight:700;
    cursor:pointer; border:none; font-family:'Space Grotesk',sans-serif;
    transition:all .15s; }
  .btn-pause { background:rgba(245,158,11,.12); color:var(--amber);
    border:1px solid rgba(245,158,11,.3); }
  .btn-pause:hover { background:rgba(245,158,11,.2); }
  .btn-clear { background:rgba(30,41,59,.8); color:#94a3b8;
    border:1px solid rgba(30,41,59,.8); }
  .btn-clear:hover { color:var(--text); }
  .btn-export { background:rgba(34,197,94,.1); color:var(--green);
    border:1px solid rgba(34,197,94,.25); }
  .btn-export:hover { background:rgba(34,197,94,.2); }
  .filter-btns { display:flex; gap:4px; }
  .filter-btn { padding:5px 10px; border-radius:5px; font-size:10px; font-weight:700;
    cursor:pointer; border:1px solid rgba(30,41,59,.8); background:none;
    color:var(--muted); font-family:'JetBrains Mono',monospace; transition:all .15s; }
  .filter-btn.active { color:var(--text); background:rgba(34,197,94,.08);
    border-color:rgba(34,197,94,.3); }
  .filter-btn.f-crit.active { color:var(--red); border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.08); }
  .filter-btn.f-high.active { color:var(--amber); border-color:rgba(245,158,11,.4); background:rgba(245,158,11,.08); }
  .filter-btn.f-med.active  { color:var(--cyan); border-color:rgba(6,182,212,.4); background:rgba(6,182,212,.08); }
  .visible-count { font-size:10px; font-family:'JetBrains Mono',monospace; color:var(--muted); }

  /* ── Feed ── */
  .feed { padding:12px 20px; display:flex; flex-direction:column; gap:6px;
    max-height:calc(100vh - 200px); overflow-y:auto; }
  .feed::-webkit-scrollbar { width:4px; }
  .feed::-webkit-scrollbar-track { background:var(--bg); }
  .feed::-webkit-scrollbar-thumb { background:#1e293b; border-radius:2px; }

  /* ── Threat card ── */
  .threat-card { background:var(--bg2); border:1px solid rgba(30,41,59,.8);
    border-radius:8px; padding:12px 14px; display:flex; align-items:flex-start;
    gap:12px; transition:all .2s; animation:slideIn .3s ease; }

  .threat-card:hover { border-color:rgba(34,197,94,.2); background:rgba(11,19,41,.9); }
  .threat-card.acked { opacity:0.45; }
  .threat-card.sev-CRITICAL { border-left:3px solid var(--red); }
  .threat-card.sev-HIGH     { border-left:3px solid var(--amber); }
  .threat-card.sev-MEDIUM   { border-left:3px solid var(--cyan); }
  .threat-card.sev-LOW      { border-left:3px solid var(--muted); }

  .threat-time { font-size:10px; font-family:'JetBrains Mono',monospace;
    color:var(--muted); white-space:nowrap; min-width:60px; margin-top:2px; }
  .threat-sev { font-size:9px; font-weight:700; padding:2px 7px; border-radius:4px;
    text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
  .sev-CRITICAL .threat-sev { background:rgba(239,68,68,.15); color:var(--red); border:1px solid rgba(239,68,68,.3); }
  .sev-HIGH     .threat-sev { background:rgba(245,158,11,.15); color:var(--amber); border:1px solid rgba(245,158,11,.3); }
  .sev-MEDIUM   .threat-sev { background:rgba(6,182,212,.12); color:var(--cyan); border:1px solid rgba(6,182,212,.25); }
  .sev-LOW      .threat-sev { background:rgba(100,116,139,.12); color:var(--muted); border:1px solid rgba(100,116,139,.25); }

  .threat-body { flex:1; min-width:0; }
  .threat-title { font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .threat-meta { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .threat-module { font-size:10px; font-family:'JetBrains Mono',monospace;
    color:var(--green); background:rgba(34,197,94,.08);
    border:1px solid rgba(34,197,94,.2); border-radius:3px; padding:1px 6px; }
  .threat-asset { font-size:10px; font-family:'JetBrains Mono',monospace;
    color:#94a3b8; }
  .threat-attck { font-size:10px; font-family:'JetBrains Mono',monospace;
    color:var(--purple); background:rgba(167,139,250,.08);
    border:1px solid rgba(167,139,250,.2); border-radius:3px; padding:1px 6px; }
  .threat-tactic { font-size:10px; color:var(--muted); }
  .threat-epss { font-size:10px; font-family:'JetBrains Mono',monospace; }
  .epss-high { color:var(--red); }
  .epss-med  { color:var(--amber); }
  .epss-low  { color:var(--green); }

  .btn-ack { padding:4px 10px; border-radius:5px; font-size:10px; font-weight:700;
    cursor:pointer; border:1px solid rgba(34,197,94,.3);
    background:rgba(34,197,94,.08); color:var(--green);
    font-family:'JetBrains Mono',monospace; transition:all .15s; }

  .btn-ack.acked { background:rgba(30,41,59,.5); color:var(--muted);
    border-color:rgba(30,41,59,.5); cursor:default; }
  .btn-triage { padding:4px 10px; border-radius:5px; font-size:10px; font-weight:700;
    cursor:pointer; border:1px solid rgba(6,182,212,.3);
    background:rgba(6,182,212,.08); color:var(--cyan);
    font-family:'JetBrains Mono',monospace; transition:all .15s; }
  .btn-triage:hover { background:rgba(6,182,212,.18); }
  .btn-soar { padding:4px 10px; border-radius:5px; font-size:10px; font-weight:700;
    cursor:pointer; border:1px solid rgba(239,68,68,.3);
    background:rgba(239,68,68,.08); color:var(--red);

  .triage-panel { display:none; margin-top:8px; background:rgba(2,6,23,.8);
    border:1px solid rgba(6,182,212,.2); border-radius:6px; padding:10px 12px;
    font-size:11px; font-family:'JetBrains Mono',monospace; color:#94a3b8;
    line-height:1.8; }
  .triage-panel.open { display:block; }
  .triage-label { color:var(--cyan); font-weight:600; }

  /* ── Footer ── */
  .footer { text-align:center; padding:12px; font-size:10px; color:#334155;
    border-top:1px solid var(--border); font-family:'JetBrains Mono',monospace; }
</style>

// ── State ──
let paused = false;
let activeFilter = 'ALL';
let searchQuery = '';
let cards = [];
let counts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0, acked:0, soar:0 };
let eventIdx = 0;
let cardId = 0;

// ── Shuffle threats for variety ──
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*( i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
let shuffled = shuffle(THREATS);

// ── Add event ──
function addEvent() {
  if (paused) return;
  const t = shuffled[eventIdx % shuffled.length];
  eventIdx++;
  if (eventIdx % shuffled.length === 0) shuffled = shuffle(THREATS);

  const id = ++cardId;
  const now = new Date();
  const ts = now.toTimeString().slice(0,8);

  counts[t.sev]++;
  updateKPIs();

  const card = document.createElement('div');
  card.className = `threat-card sev-${t.sev}`;
  card.id = `card-${id}`;
  card.dataset.sev = t.sev;
  card.dataset.text = `${t.title} ${t.module} ${t.asset} ${t.technique||''} ${t.tactic||''}`.toLowerCase();

  const epssHtml = t.epss != null
    ? `<span class="threat-epss ${t.epss>=0.9?'epss-high':t.epss>=0.7?'epss-med':'epss-low'}">EPSS ${(t.epss*100).toFixed(0)}%</span>`
    : '';
  const attckHtml = t.technique
    ? `<span class="threat-attck">${t.technique}</span><span class="threat-tactic">${t.tactic}</span>`
    : '';
  const soarBtn = t.soar
    ? `<button class="btn-soar" onclick="triggerSOAR(${id},'${t.soar.replace(/'/g,"\\'")}')">⚡ SOAR</button>`
    : '';

  card.innerHTML = `
    <span class="threat-time mono">${ts}</span>
    <div style="display:flex;flex-direction:column;gap:4px;min-width:80px;align-items:flex-start">
      <span class="threat-sev">${t.sev}</span>
    </div>
    <div class="threat-body">
      <div class="threat-title">${t.title}</div>
      <div class="threat-meta">
        <span class="threat-module">${t.module}</span>
        <span class="threat-asset mono">${t.asset}</span>
        ${attckHtml}
        ${epssHtml}
      </div>
      <div class="threat-actions">
        <button class="btn-ack" id="ack-${id}" onclick="acknowledge(${id})">✓ Acknowledge</button>
        <button class="btn-triage" onclick="toggleTriage(${id})">🔍 Triage</button>
        ${soarBtn}
      </div>
      <div class="triage-panel" id="triage-${id}">
        <span class="triage-label">AUTO-TRIAGE:</span> ${t.detail}
        ${t.soar ? `<br><span class="triage-label">SOAR ACTION:</span> ${t.soar}` : ''}
        ${t.technique ? `<br><span class="triage-label">ATT&CK:</span> ${t.technique} · ${t.tactic}` : ''}
        ${t.epss != null ? `<br><span class="triage-label">EPSS:</span> ${(t.epss*100).toFixed(0)}% exploitation probability` : ''}
      </div>
    </div>`;

  cards.unshift({id, sev:t.sev, el:card});

  const feed = document.getElementById('feed');
  feed.insertBefore(card, feed.firstChild);

  // Keep max 100 cards
  if (cards.length > 100) {
    const old = cards.pop();
    if (old.el.parentNode) old.el.parentNode.removeChild(old.el);
  }

  applyFilter();
  updateVisibleCount();
}

// ── Acknowledge ──
function acknowledge(id) {
  const btn = document.getElementById(`ack-${id}`);
  const card = document.getElementById(`card-${id}`);
  if (!btn || btn.classList.contains('acked')) return;
  btn.textContent = '✓ Acknowledged';
  btn.classList.add('acked');
  card.classList.add('acked');
  counts.acked++;
  updateKPIs();
}

// ── SOAR ──
function triggerSOAR(id, action) {
  acknowledge(id);
  counts.soar++;
  updateKPIs();
  const triage = document.getElementById(`triage-${id}`);
  if (triage) {
    triage.classList.add('open');
    triage.innerHTML += `<br><span style="color:var(--red);font-weight:700">⚡ SOAR TRIGGERED:</span> ${action}`;
  }
}

// ── Triage toggle ──
function toggleTriage(id) {
  const panel = document.getElementById(`triage-${id}`);
  if (panel) panel.classList.toggle('open');
}

// ── Filter ──
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilter();
  updateVisibleCount();
}

function filterFeed() {
  searchQuery = document.getElementById('search').value.toLowerCase();
  applyFilter();
  updateVisibleCount();
}

function applyFilter() {
  cards.forEach(({sev, el, id}) => {
    const sevMatch = activeFilter === 'ALL' || sev === activeFilter;
    const textMatch = !searchQuery || el.dataset.text.includes(searchQuery);
    el.style.display = (sevMatch && textMatch) ? '' : 'none';
  });
}

function updateVisibleCount() {
  const visible = cards.filter(({el}) => el.style.display !== 'none').length;
  document.getElementById('visible-count').textContent = `${visible} visible`;
}

// ── KPIs ──
function updateKPIs() {
  document.getElementById('cnt-crit').textContent  = counts.CRITICAL;
  document.getElementById('cnt-high').textContent  = counts.HIGH;
  document.getElementById('cnt-med').textContent   = counts.MEDIUM;
  document.getElementById('cnt-low').textContent   = counts.LOW;
  document.getElementById('cnt-acked').textContent = counts.acked;
  document.getElementById('cnt-soar').textContent  = counts.soar;
}

// ── Pause ──
function togglePause() {
  paused = !paused;
  document.getElementById('pause-btn').textContent = paused ? '▶ Resume' : '⏸ Pause';
}

// ── Clear ──
function clearFeed() {
  document.getElementById('feed').innerHTML = '';
  cards = [];
  counts = { CRITICAL:0, HIGH:0, MEDIUM:0, LOW:0, acked:0, soar:0 };
  updateKPIs();
  updateVisibleCount();
}

// ── Export ──
function exportFeed() {
  const data = cards.map(({sev, el}) => ({
    severity: sev,
    title: el.querySelector('.threat-title')?.textContent,
    module: el.querySelector('.threat-module')?.textContent,
    asset: el.querySelector('.threat-asset')?.textContent,
    technique: el.querySelector('.threat-attck')?.textContent,
    time: el.querySelector('.threat-time')?.textContent,
    acknowledged: el.classList.contains('acked'),
  }));
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `s313-threats-${new Date().toISOString().slice(0,19).replace(/:/g,'-')}.json`;
  a.click();
}

// ── Start feed — randomized intervals, no looping ──
function scheduleNext() {
  // Vary interval: CRITICAL events come faster
  const base = 2000 + Math.random() * 3000;
  setTimeout(() => { addEvent(); scheduleNext(); }, base);
}

// Seed with a few initial events
for (let i = 0; i < 5; i++) {
  setTimeout(() => addEvent(), i * 400);
}
scheduleNext();
</script>
