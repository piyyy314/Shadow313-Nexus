netlify.toml
TOML

# ============================================================
# SHADOW313 NEXUS — Netlify Deployment Configuration
# Deploy to: shadow313.dev (primary) + shadow313.com (redirect)
# ============================================================

[build]
  publish = "."
  command = "echo 'Static site — no build step required'"

# ── Redirects ─────────────────────────────────────────────────
# Redirect shadow313.com → shadow313.dev (301 permanent)
[[redirects]]
  from = "https://shadow313.com/*"
  to   = "https://shadow313.dev/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.shadow313.com/*"
  to   = "https://shadow313.dev/:splat"
  status = 301
  force  = true

[[redirects]]
  from = "https://www.shadow313.dev/*"
  to   = "https://shadow313.dev/:splat"
  status = 301
  force  = true

# ── Clean URLs ────────────────────────────────────────────────
[[redirects]]
  from = "/marketplace"
  to   = "/marketplace/index.html"
  status = 200

[[redirects]]
  from = "/analytics"
  to   = "/marketplace/analytics.html"
  status = 200

[[redirects]]
  from = "/analytics/live"
  to   = "/marketplace/analytics-live.html"
  status = 200

[[redirects]]
  from = "/tools/aegis"
  to   = "/tools/aegis-nexus.html"
  status = 200

[[redirects]]
  from = "/tools/sovereign-shield"
  to   = "/tools/sovereign-shield.html"
  status = 200

[[redirects]]
  from = "/docs"
  to   = "/docs/index.html"
  status = 200

# ── Security Headers ──────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy    = "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data:; font-src 'self' https: data:;"

# ── Cache Control ─────────────────────────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"