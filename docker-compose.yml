# Local stack: Windows native Ollama is a separate alternative, not this volume.
x-security-defaults:
  security_opt:
  - no-new-privileges:true
  cap_drop: &id001
  - ALL
  cap_add: &id002
  - NET_BIND_SERVICE
x-resource-defaults:
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '0.5'
      reservations:
        memory: 128M
services:
  ollama:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    image: ollama/ollama:latest
    container_name: shadow313-ollama
    restart: unless-stopped
    expose:
    - '11434'
    volumes:
    - ollama_data:/root/.ollama
    environment:
    - OLLAMA_KEEP_ALIVE=24h
    - OLLAMA_NUM_PARALLEL=2
    - OLLAMA_HOST=0.0.0.0
    networks:
    - shadow313_internal
    - shadow313_external
    healthcheck:
      test:
      - CMD
      - ollama
      - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 2G
  telegram-bot:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    build:
      context: .
      target: nexus
    image: shadow313-satexpert-bot:local
    container_name: shadow313-telegram-bot
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 64M
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    - OLLAMA_URL=http://ollama:11434
    - OLLAMA_MODEL=${OLLAMA_MODEL:-matarmohamad313/shadow313-nexus}
    - TELEGRAM_POLL_INTERVAL=${TELEGRAM_POLL_INTERVAL:-2}
    - SHADOW313_API_URL=http://shadow313-api:8313
    - SHADOW313_API_KEY=${SHADOW313_API_KEY:?SHADOW313_API_KEY must be set}
    command:
    - python
    - -m
    - shadow313.integrations.telegram.bot
    networks:
    - shadow313_internal
    - shadow313_external
    read_only: true
    tmpfs:
    - /tmp:size=50m,mode=1777
    entrypoint: []
    profiles:
    - telegram
  ollama-init:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    image: ollama/ollama:latest
    container_name: shadow313-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
    - ollama_data:/root/.ollama
    - ./docker/ollama/init.sh:/init.sh:ro
    entrypoint:
    - /bin/sh
    - /init.sh
    environment:
    - OLLAMA_HOST=http://ollama:11434
    networks:
    - shadow313_internal
    restart: 'no'
    read_only: true
    tmpfs:
    - /tmp:size=100m,mode=1777
  open-webui:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    image: ghcr.io/open-webui/open-webui:main
    container_name: shadow313-open-webui
    restart: unless-stopped
    expose:
    - '8080'
    volumes:
    - openwebui_data:/app/backend/data
    environment:
    - OLLAMA_BASE_URL=http://ollama:11434
    - WEBUI_AUTH=true
    - WEBUI_NAME=Shadow313 NEXUS AI
    - WEBUI_URL=http://localhost:3000
    - DEFAULT_MODELS=matarmohamad313/shadow313-nexus
    - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set}
    - SCARF_NO_ANALYTICS=true
    - DO_NOT_TRACK=true
    - ANONYMIZED_TELEMETRY=false
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - shadow313_internal
    - shadow313_external
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8080/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 256M
  shadow313-cli:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    build:
      context: .
      target: nexus
    image: piyyy314/shadow313-nexus:4.0.0
    container_name: shadow313-cli
    read_only: true
    tmpfs:
    - /tmp:size=200m,mode=1777
    - /home/shadow313/.shadow313/logs:size=100m
    volumes:
    - shadow313_data:/home/shadow313/.shadow313:rw
    - ./:/workspace:ro
    environment:
    - SHADOW313_AI_ENDPOINT=http://ollama:11434
    - SHADOW313_AI_BACKEND=ollama
    - SHADOW313_AI_MODEL=matarmohamad313/shadow313-nexus
    - SHADOW313_OUTPUT=rich
    depends_on:
      ollama:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
    - shadow313_internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
  shadow313-api:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    build:
      context: .
      target: nexus
    image: piyyy314/shadow313-nexus:4.0.0
    container_name: shadow313-api
    restart: unless-stopped
    read_only: true
    tmpfs:
    - /tmp:size=100m,mode=1777
    command:
    - python
    - -m
    - shadow313.api.server
    - --host
    - 0.0.0.0
    - --port
    - '8313'
    expose:
    - '8313'
    volumes:
    - shadow313_data:/home/shadow313/.shadow313:rw
    environment:
    - SHADOW313_AI_ENDPOINT=http://ollama:11434
    - SHADOW313_AI_BACKEND=ollama
    - SHADOW313_AI_MODEL=matarmohamad313/shadow313-nexus
    - SHADOW313_API_KEY=${SHADOW313_API_KEY:?SHADOW313_API_KEY must be set}
    - SHADOW313_ENV=production
    depends_on:
      ollama:
        condition: service_healthy
    networks:
    - shadow313_internal
    - shadow313_external
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8313/health
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 128M
    entrypoint: []
  chromadb:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    image: chromadb/chroma:latest
    container_name: shadow313-chromadb
    restart: unless-stopped
    expose:
    - '8000'
    volumes:
    - chroma_data:/chroma/chroma
    environment:
    - CHROMA_SERVER_HOST=0.0.0.0
    - CHROMA_SERVER_HTTP_PORT=8000
    - ANONYMIZED_TELEMETRY=false
    networks:
    - shadow313_internal
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8000/api/v1/heartbeat
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
    profiles:
    - rag
  nginx:
    security_opt:
    - no-new-privileges:true
    cap_drop: *id001
    cap_add: *id002
    image: nginx:alpine
    container_name: shadow313-nginx
    restart: unless-stopped
    user: nginx
    read_only: true
    tmpfs:
    - /var/cache/nginx:size=100m
    - /var/run:size=10m
    - /tmp:size=50m
    ports:
    - 127.0.0.1:80:80
    - 127.0.0.1:443:443
    - 127.0.0.1:8080:8080
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    - nginx_logs:/var/log/nginx
    depends_on:
    - open-webui
    - shadow313-api
    networks:
    - shadow313_external
    - shadow313_internal
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 32M
volumes:
  shadow313_data:
    driver: local
  ollama_data:
    driver: local
  openwebui_data:
    driver: local
  chroma_data:
    driver: local
  nginx_logs:
    driver: local
networks:
  shadow313_internal:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 172.20.0.0/24
  shadow313_external:
    driver: bridge
    ipam:
      config:
      - subnet: 172.20.1.0/24
  sandbox:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: 172.21.0.0/16
