# Optional PostgreSQL overlay for the ShiatoAli API.
# Keep the database on the internal Docker network; no host port is published.
services:
  shiatoali-postgres:
    image: postgres:16
    container_name: shadow313-shiatoali-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SHIAATOALI_POSTGRES_DB:-shiatoali}
      POSTGRES_USER: ${SHIAATOALI_POSTGRES_USER:-shiatoali}
      POSTGRES_PASSWORD_FILE: /run/secrets/shiatoali_postgres_password
    volumes:
      - shiatoali_postgres_data:/var/lib/postgresql/data
    secrets:
      - shiatoali_postgres_password
    networks:
      - shadow313_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  shiatoali-migrate:
    image: piyyy314/shadow313-nexus:4.0.0
    build:
      context: .
      target: nexus
    container_name: shadow313-shiatoali-migrate
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./:/workspace:ro
    entrypoint: []
    command: ["alembic", "-c", "alembic-shiatoali.ini", "upgrade", "head"]
    environment:
      SHIAATOALI_DATABASE_URL: ${SHIAATOALI_DATABASE_URL:?Set SHIAATOALI_DATABASE_URL in .env}
    depends_on:
      shiatoali-postgres:
        condition: service_healthy
    networks:
      - shadow313_internal

  shadow313-api:
    environment:
      SHIAATOALI_DATABASE_URL: ${SHIAATOALI_DATABASE_URL:?Set SHIAATOALI_DATABASE_URL in .env}
    depends_on:
      shiatoali-migrate:
        condition: service_completed_successfully

volumes:
  shiatoali_postgres_data:
    driver: local

secrets:
  shiatoali_postgres_password:
    environment: SHIAATOALI_POSTGRES_PASSWORD
