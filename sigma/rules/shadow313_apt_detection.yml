title: Shadow313 APT Detection — Lateral Movement via Pass-the-Hash
id: s313-apt-001
status: stable
description: Detects Pass-the-Hash lateral movement (T1550.002)
author: Shadow313 Core Team
date: 2026-10-20
tags:
  - attack.lateral_movement
  - attack.t1550.002
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624
    LogonType: 3
    AuthenticationPackageName: NTLM
  filter:
    SubjectUserName|endswith: '$'
  condition: selection and not filter
falsepositives:
  - Legitimate NTLM authentication
level: high
