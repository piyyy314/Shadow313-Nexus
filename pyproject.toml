[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "shadow313"
version         = "4.0.0"
description     = "Shadow313 NEXUS — Local-First AI-Powered Security Intelligence CLI"
readme          = "README.md"
license         = {text = "MIT"}
requires-python = ">=3.11"
authors         = [{name = "Shadow313 Core Team / mohamad", email = "ops@shadow313.dev"}]
keywords        = ["security","pentest","cli","ai","vulnerability","recon","quantum","nexus","pqc"]
classifiers     = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pyyaml>=6.0.1",
    "rich>=13.7.1",
]

[project.optional-dependencies]
core = ["pyyaml>=6.0.1","rich>=13.7.1"]
ai   = ["openai>=1.0"]
ml   = ["scikit-learn>=1.3","joblib>=1.3","onnxruntime>=1.16"]
dashboard = ["fastapi>=0.104","uvicorn[standard]>=0.24","jinja2>=3.1","python-multipart>=0.0.6"]
reports   = ["weasyprint>=60.0","jinja2>=3.1"]
graph     = ["networkx>=3.2"]
security  = ["cryptography>=41.0","keyring>=24.0"]
rag       = ["chromadb>=0.4","sentence-transformers>=2.2"]
finetune  = ["unsloth>=2024.1","trl>=0.7","datasets>=2.14","peft>=0.6"]
pqc       = ["pqcrypto>=0.1"]
recon     = ["dnspython>=2.4","python-whois>=0.8"]
network   = ["scapy>=2.5"]
browser   = ["playwright>=1.40"]
cloud     = ["boto3>=1.28","kubernetes>=28.0"]
full = [
    "pyyaml>=6.0.1","rich>=13.7.1","dnspython>=2.4","python-whois>=0.8",
    "cryptography>=41.0","scapy>=2.5","fastapi>=0.104","uvicorn[standard]>=0.24",
    "jinja2>=3.1","networkx>=3.2","scikit-learn>=1.3","joblib>=1.3","keyring>=24.0",
]
dev = [
    "pytest>=7.0","pytest-asyncio>=0.23","black>=24.0",
    "ruff>=0.4","mypy>=1.10","coverage>=7.0","numpy>=1.26","pyspx>=0.5.0",
]

[project.scripts]
shadow313 = "shadow313.cli.main:main"

[project.urls]
Homepage   = "https://shadow313.dev"
Repository = "https://github.com/piyyy314/Shadow313-Nexus"
Issues     = "https://github.com/piyyy314/Shadow313-Nexus/issues"
Changelog  = "https://github.com/piyyy314/Shadow313-Nexus/blob/master/CHANGELOG.md"

[tool.black]
line-length    = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","S","B","A","C4"]
ignore = ["S101","S603","S607","S608","S324","S311","S506","UP007"]

[tool.mypy]
python_version         = "3.11"
strict                 = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths    = ["tests"]
asyncio_mode = "auto"
addopts      = "-v --tb=short"

[tool.coverage.run]
source = ["shadow313"]
omit   = ["tests/*"]

[tool.coverage.report]
show_missing = true

[tool.setuptools.packages.find]
where   = ["."]
include = ["shadow313*"]
exclude = ["tests*", "uploaded_files*", "data*", "tmp*"]